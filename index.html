<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>for you</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: a centred column floating in a galaxy that drifts with the cursor; title, one line, three glass cards (stacked on phones, a row on wide screens). */
:root {
  --space: #03040b;
  --ink: #f5f6fb;
  --ink-soft: rgba(245, 246, 251, 0.62);
  --ink-faint: rgba(245, 246, 251, 0.38);
  --glass: rgba(255, 255, 255, 0.045);
  --glass-hi: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.11);
  --pink: #ff6fae;
  --cyan: #6ff3ff;
  --green: #5dffa4;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; margin: 0; }
body {
  background: var(--space); color: var(--ink); font-family: var(--font);
  text-transform: lowercase; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}
#sky, #trail { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#trail { z-index: 5; }

main {
  position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 56px) calc(env(safe-area-inset-bottom, 0px) + 40px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

header { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.eyebrow { font-size: 15px; font-weight: 400; letter-spacing: .01em; color: var(--ink-soft); }
h1 {
  margin: 0; font-weight: 600; font-size: clamp(64px, 17vw, 128px); line-height: .95; letter-spacing: -.05em;
  text-shadow: 0 0 40px rgba(111, 243, 255, .18);
}
h1 .heart { color: var(--pink); margin-left: .06em; display: inline-block; width: .5em; height: .46em; vertical-align: .06em; filter: drop-shadow(0 0 18px rgba(255, 111, 174, .6)); animation: beat 2.6s ease-in-out infinite; }
h1 .heart svg, .mini svg { display: block; width: 100%; height: 100%; }
.mini { display: inline-block; width: 11px; height: 10px; color: var(--pink); opacity: .8; vertical-align: -1px; }
@keyframes beat { 0%, 60%, 100% { transform: scale(1); } 10% { transform: scale(1.12); } 20% { transform: scale(1); } 30% { transform: scale(1.08); } }
.lede { margin: 0; max-width: 30ch; font-size: 17px; line-height: 1.5; font-weight: 400; color: var(--ink-soft); text-wrap: balance; }

.cards { width: 100%; max-width: 960px; display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 760px) { .cards { grid-template-columns: repeat(3, 1fr); gap: 16px; } }

.card {
  --accent: var(--cyan);
  position: relative; min-width: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px;
  padding: 18px 20px; border-radius: 20px; text-decoration: none; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), background .3s, border-color .3s, box-shadow .3s;
}
@media (min-width: 760px) {
  .card { grid-template-columns: 1fr auto; grid-template-rows: auto auto auto; padding: 24px 24px 22px; gap: 0; min-height: 210px; align-items: start; }
  .card .icon { grid-column: 1; grid-row: 1; margin-bottom: 36px; }
  .card .text { grid-column: 1 / -1; grid-row: 2; }
  .card .arrow { grid-column: 2; grid-row: 1; }
}
.card.pink { --accent: var(--pink); }
.card.green { --accent: var(--green); }
.card:hover, .card:focus-visible { transform: translateY(-3px); background: var(--glass-hi); border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 10px 40px -12px color-mix(in srgb, var(--accent) 45%, transparent); outline: none; }
.card:active { transform: translateY(-1px) scale(.995); }
.icon {
  width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent);
}
.icon svg { width: 22px; height: 22px; }
.text { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.card h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.card p { margin: 0; font-size: 15px; line-height: 1.4; color: var(--ink-soft); }
.arrow { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--ink-soft); transition: background .3s, color .3s, border-color .3s, transform .3s; }
.arrow svg { width: 14px; height: 14px; }
.card:hover .arrow, .card:focus-visible .arrow { background: var(--accent); border-color: var(--accent); color: var(--space); transform: translateX(2px); }

footer { font-size: 13px; color: var(--ink-faint); letter-spacing: .01em; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<canvas id="sky"></canvas>
<main>
  <header>
    <div class="eyebrow">made with love, just for</div>
    <h1>you<span class="heart" aria-label="love"><svg viewBox="0 0 24 22" aria-hidden="true"><path fill="currentColor" d="M12 21.5C5.6 16.6 1 12.5 1 7.4 1 3.9 3.7 1.2 7.1 1.2c2 0 3.8 1 4.9 2.6 1.1-1.6 2.9-2.6 4.9-2.6 3.4 0 6.1 2.7 6.1 6.2 0 5.1-4.6 9.2-11 14.1z"/></svg></span></h1>
    <p class="lede">three little things i made for you. open them in any order.</p>
  </header>

  <nav class="cards" aria-label="pages">
    <a class="card pink" href="letter.html">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></span>
      <span class="text"><h2>a letter</h2><p>everything i wanted to say, written down.</p></span>
      <span class="arrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
    <a class="card" href="map.html">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></span>
      <span class="text"><h2>lovetap</h2><p>spin the globe, find ten cities, see what they make.</p></span>
      <span class="arrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
    <a class="card green" href="list.html">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></span>
      <span class="text"><h2>the list</h2><p>photos, songs, and all the little things.</p></span>
      <span class="arrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
  </nav>

  <footer>made with <span class="mini"><svg viewBox="0 0 24 22" aria-hidden="true"><path fill="currentColor" d="M12 21.5C5.6 16.6 1 12.5 1 7.4 1 3.9 3.7 1.2 7.1 1.2c2 0 3.8 1 4.9 2.6 1.1-1.6 2.9-2.6 4.9-2.6 3.4 0 6.1 2.7 6.1 6.2 0 5.1-4.6 9.2-11 14.1z"/></svg></span></footer>
</main>
<canvas id="trail"></canvas>

<script>
/* galaxy background that drifts with the cursor, plus a shimmering star trail */
(function () {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sky = document.getElementById("sky"), sx = sky.getContext("2d");
  const trail = document.getElementById("trail"), tx = trail.getContext("2d");
  let W = 0, H = 0, dpr = 1, layers = [], nebula = null;
  const pointer = { x: 0, y: 0, tx: 0, ty: 0 };   // smoothed / target offset from centre, -1..1

  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

  function build() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [sky, trail]) { c.width = W * dpr; c.height = H * dpr; }
    const pad = 80, rnd = rng(23);
    // three depth layers: far stars move least, near stars move most
    layers = [
      { depth: 10, count: W * H / 1400, size: [0.4, 0.9], alpha: [0.25, 0.6] },
      { depth: 26, count: W * H / 4200, size: [0.7, 1.3], alpha: [0.4, 0.85] },
      { depth: 52, count: W * H / 14000, size: [1.1, 2.0], alpha: [0.6, 1.0] },
    ].map(l => ({ ...l, stars: Array.from({ length: Math.round(l.count) }, () => ({
      x: rnd() * (W + pad * 2) - pad, y: rnd() * (H + pad * 2) - pad,
      r: l.size[0] + rnd() * (l.size[1] - l.size[0]), a: l.alpha[0] + rnd() * (l.alpha[1] - l.alpha[0]),
      tw: rnd() * 6.28, sp: 0.4 + rnd() * 1.6,
      c: rnd() < .1 ? "255,170,210" : rnd() < .2 ? "170,240,255" : "235,240,255",
    })) }));
    // soft galaxy clouds, painted once
    const nb = document.createElement("canvas"), m = 1.25;
    nb.width = W * m * dpr; nb.height = H * m * dpr;
    const n = nb.getContext("2d"), R = Math.max(W, H) * dpr;
    const blob = (x, y, r, col) => { const g = n.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)"); n.fillStyle = g; n.fillRect(0, 0, nb.width, nb.height); };
    n.globalCompositeOperation = "lighter";
    blob(nb.width * .28, nb.height * .3, R * .55, "rgba(120, 60, 200, .16)");
    blob(nb.width * .74, nb.height * .62, R * .5, "rgba(255, 80, 160, .11)");
    blob(nb.width * .55, nb.height * .42, R * .32, "rgba(80, 220, 255, .08)");
    blob(nb.width * .2, nb.height * .82, R * .35, "rgba(60, 120, 255, .09)");
    // a faint band of dust across the middle, like the milky way
    n.save(); n.translate(nb.width / 2, nb.height / 2); n.rotate(-0.42);
    const band = n.createLinearGradient(0, -R * .22, 0, R * .22);
    band.addColorStop(0, "rgba(0,0,0,0)"); band.addColorStop(.5, "rgba(190, 200, 255, .07)"); band.addColorStop(1, "rgba(0,0,0,0)");
    n.fillStyle = band; n.fillRect(-R, -R * .22, R * 2, R * .44);
    for (let i = 0; i < 900; i++) { const t = rnd(); n.fillStyle = `rgba(230,235,255,${.15 + rnd() * .35})`; n.fillRect((t - .5) * R * 1.6, (rnd() + rnd() + rnd() - 1.5) * R * .09, dpr * .9, dpr * .9); }
    n.restore();
    nebula = nb;
  }

  function drawSky(time) {
    pointer.x += (pointer.tx - pointer.x) * 0.06;
    pointer.y += (pointer.ty - pointer.y) * 0.06;
    sx.setTransform(1, 0, 0, 1, 0, 0);
    sx.fillStyle = "#03040b"; sx.fillRect(0, 0, sky.width, sky.height);
    // galaxy clouds drift slowly with the cursor
    const nOff = 18 * dpr, ex = (nebula.width - sky.width) / 2, ey = (nebula.height - sky.height) / 2;
    sx.drawImage(nebula, -ex - pointer.x * nOff, -ey - pointer.y * nOff);
    sx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const drift = reduce ? 0 : time * 0.004; // a very slow sideways drift
    for (const l of layers) {
      const ox = -pointer.x * l.depth - drift * l.depth / 26, oy = -pointer.y * l.depth;
      for (const s of l.stars) {
        let x = s.x + ox, y = s.y + oy;
        x = ((x + 80) % (W + 160) + (W + 160)) % (W + 160) - 80;
        sx.globalAlpha = reduce ? s.a : s.a * (0.6 + 0.4 * Math.sin(time / 1000 * s.sp + s.tw));
        sx.fillStyle = `rgb(${s.c})`;
        sx.beginPath(); sx.arc(x, y, s.r, 0, 6.283); sx.fill();
      }
    }
    sx.globalAlpha = 1;
  }

  /* shimmering star trail */
  const sparks = [];
  let last = null;
  function spawn(x, y) {
    if (reduce) return;
    const dist = last ? Math.hypot(x - last.x, y - last.y) : 0;
    const n = Math.min(6, 1 + Math.floor(dist / 9));
    for (let i = 0; i < n; i++) {
      const t = last ? i / n : 0;
      const px = last ? last.x + (x - last.x) * t : x, py = last ? last.y + (y - last.y) * t : y;
      const r = Math.random();
      sparks.push({
        x: px + (Math.random() - .5) * 6, y: py + (Math.random() - .5) * 6,
        vx: (Math.random() - .5) * .5, vy: Math.random() * .35 + .05,
        life: 0, max: 700 + Math.random() * 900, size: 2.5 + Math.random() * 5.5, rot: Math.random() * 6.28,
        tw: Math.random() * 6.28,
        c: r < .45 ? [255, 255, 255] : r < .7 ? [140, 245, 255] : r < .9 ? [255, 150, 200] : [255, 225, 150],
      });
    }
    last = { x, y };
    if (sparks.length > 400) sparks.splice(0, sparks.length - 400);
  }
  function star(ctx, x, y, s, rot) { // four-point twinkle
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.moveTo(0, 0); ctx.quadraticCurveTo(s * .14, s * .14, 0, s); ctx.quadraticCurveTo(-s * .14, s * .14, 0, 0);
    }
    ctx.fill(); ctx.restore();
  }
  let prev = performance.now();
  function drawTrail(now) {
    const dt = Math.min(50, now - prev); prev = now;
    tx.setTransform(1, 0, 0, 1, 0, 0); tx.clearRect(0, 0, trail.width, trail.height);
    tx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tx.globalCompositeOperation = "lighter";
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.life += dt;
      if (p.life >= p.max) { sparks.splice(i, 1); continue; }
      const k = p.life / p.max, fade = k < .12 ? k / .12 : 1 - (k - .12) / .88;
      const shimmer = .55 + .45 * Math.sin(now / 70 + p.tw);
      p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.rot += .002 * dt;
      const s = p.size * (1 - k * .5);
      const [r, g, b] = p.c;
      tx.globalAlpha = fade * .35; tx.fillStyle = `rgb(${r},${g},${b})`;
      tx.beginPath(); tx.arc(p.x, p.y, s * .9, 0, 6.283); tx.fill();           // soft glow
      tx.globalAlpha = fade * shimmer; star(tx, p.x, p.y, s * 1.4, p.rot);      // sparkle
      tx.globalAlpha = fade; tx.fillStyle = "#fff"; tx.beginPath(); tx.arc(p.x, p.y, Math.max(.6, s * .16), 0, 6.283); tx.fill();
    }
    tx.globalAlpha = 1; tx.globalCompositeOperation = "source-over";
  }

  function move(x, y) {
    pointer.tx = (x / W) * 2 - 1; pointer.ty = (y / H) * 2 - 1;
    spawn(x, y);
  }
  window.addEventListener("pointermove", e => move(e.clientX, e.clientY), { passive: true });
  window.addEventListener("touchmove", e => { const t = e.touches[0]; if (t) move(t.clientX, t.clientY); }, { passive: true });
  window.addEventListener("pointerleave", () => { last = null; });
  window.addEventListener("pointerdown", e => { last = null; move(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener("touchend", () => { last = null; }, { passive: true });
  document.addEventListener("mouseleave", () => { pointer.tx = 0; pointer.ty = 0; last = null; });

  function frame(now) { drawSky(now); drawTrail(now); requestAnimationFrame(frame); }
  window.addEventListener("resize", build);
  build(); requestAnimationFrame(frame);
})();
</script>
