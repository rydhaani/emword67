<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mutahar's 27th</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=IM+Fell+English+SC&family=Nunito:wght@500;700;800&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }

/* Layout: home = the hand-lettered title over ten candles (one blown per day); a game page = buddy beside the game. Single light look on purpose, matching the artwork. */
:root {
  --bg: #ffffff;
  --paper: #ffffff;
  --tint: #f7f3f5;
  --ink: #231c20;         /* the near-black of the title */
  --soft: #857a80;
  --accent: #e0606e;      /* candle red */
  --c-red: #e46a78; --c-purple: #c99ddb; --c-yellow: #f1e38a; --c-green: #b7d78f; --c-blue: #86c4d6;
  --hit: #78b65a;         /* right spot */
  --near: #efcf4f;        /* wrong spot */
  --miss: #d9d2d6;        /* not in word */
  --line: #ece5e9;
  --display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --display-sc: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 20px; }
/* home: title + candles */
.home { display: grid; justify-items: center; gap: 10px; padding-block: 4vh 10px; text-align: center; }
.home .pre { font-family: var(--display); font-size: clamp(26px, 6vw, 40px); line-height: 1; margin: 0; }
.home h1 { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 12vw, 92px); line-height: 1; margin: 0 0 8px; letter-spacing: .01em; }
.cake-row { display: flex; justify-content: center; align-items: flex-end; gap: clamp(4px, 1.6vw, 14px); width: 100%; max-width: 560px; }
.candle { border: 0; background: none; padding: 0; font: inherit; color: var(--soft); display: grid; justify-items: center; gap: 6px; cursor: pointer; flex: 1 1 0; min-width: 0; -webkit-tap-highlight-color: transparent; }
.candle svg { width: 100%; max-width: 46px; height: auto; overflow: visible; display: block; }
.candle .flame { transform-origin: 17px 34px; transform-box: view-box; transition: transform .5s ease-in, opacity .5s ease-in; }
.candle .flame { animation: sway 2.6s ease-in-out infinite alternate; }
.candle:nth-child(odd) .flame { animation-duration: 3.1s; animation-delay: -.8s; }
.candle .glow { opacity: 0; transition: opacity .3s; }
.candle .smoke { opacity: 0; }
.candle .day { font-size: 11px; font-weight: 800; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.candle.ready .glow { opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
.candle.ready .flame { animation: flick .35s ease-in-out infinite alternate; }
.candle.ready .day { color: var(--accent); }
.candle.blown .flame { opacity: 0; transform: scale(.2, 0); animation: none; }
.candle.blown .day { color: var(--ink); }
.candle.blowing .flame { animation: blowout .7s ease-in forwards; }
.candle.blowing .smoke { animation: smoke 1.4s ease-out .45s forwards; }
.candle.locked { cursor: default; }
.candle:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
.candle.nope svg { animation: nope .4s; }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes flick { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(1.08, 1.14) rotate(3deg); } }
@keyframes pulse { 0%,100% { transform: scale(.85); opacity: .55; } 50% { transform: scale(1.15); opacity: 1; } }
@keyframes blowout { 0% { transform: rotate(0); } 30% { transform: rotate(-28deg) scale(1.1, .9); } 60% { transform: rotate(-40deg) scale(.6, .4); opacity: .8; } 100% { transform: rotate(-50deg) scale(0); opacity: 0; } }
@keyframes smoke { 0% { opacity: .9; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-34px); } }
@keyframes nope { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.hint { min-height: 3.2em; display: grid; gap: 2px; justify-items: center; margin-top: 10px; }
.hint .line { font-family: var(--display); font-size: clamp(20px, 4.4vw, 26px); }
.hint .clockline { color: var(--soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.hint .nudge { color: var(--accent); }

/* game page header */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { font: 800 14px var(--body); color: var(--ink); background: none; border: 0; cursor: pointer; padding: 6px 0; }
.back:hover { color: var(--accent); }
.topbar .mark { font-family: var(--display); font-size: 18px; color: var(--soft); }

.card { background: var(--paper); border-radius: 22px; padding: 22px max(16px, 3vw); border: 1.5px solid var(--line); box-shadow: 0 14px 34px -26px rgba(35,28,32,.35); display: grid; gap: 16px; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0; text-align: center; }
.card p { margin: 0; text-align: center; color: var(--soft); max-width: 52ch; justify-self: center; }
.preview-note { font-size: 13px; text-align: center; color: var(--soft); background: #fff; border: 1px dashed var(--accent); border-radius: 999px; padding: 6px 14px; justify-self: center; display: flex; flex-wrap: wrap; gap: 6px 10px; justify-content: center; align-items: center; }
.preview-note button, .preview-note a { font: 700 12px var(--body); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

.clock { font-family: var(--display); font-size: clamp(40px, 12vw, 72px); text-align: center; font-variant-numeric: tabular-nums; color: var(--accent); }

/* stage: buddy beside the game */
.stage { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: start; }
.game { display: grid; gap: 16px; min-width: 0; }

/* buddy */
#buddy-slot { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 5; align-self: start; }
.buddy { display: grid; justify-items: center; gap: 10px; padding: 14px 10px; border-radius: 18px; background: #fff; border: 2px solid var(--line); z-index: 5; }
.spritebox { position: relative; width: 130px; height: 240px; display: grid; place-items: end center; }
.sprite { width: 130px; height: 240px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; transition: filter .3s; }
.bubble { position: relative; background: var(--tint); border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 14px; text-align: center; color: var(--ink); min-height: 2.6em; display: grid; place-items: center; width: 100%; }
.bubble::before { content: ""; position: absolute; top: -8px; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--tint); }
.bname { font-family: var(--display); font-size: 18px; color: var(--accent); line-height: 1; }
.edit-buddy { font: 700 12px var(--body); color: var(--soft); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }

.fx > * { position: absolute; opacity: 0; transition: opacity .25s; pointer-events: none; }
.cloud { top: -22px; left: 50%; transform: translateX(-50%); width: 96px; height: 40px; image-rendering: pixelated; }
.rain { top: 14px; left: 50%; transform: translateX(-50%); width: 80px; height: 40px; }
.rain i { position: absolute; top: 0; width: 3px; height: 8px; background: #7fa7e8; border-radius: 2px; animation: drop .9s linear infinite; }
.think { top: 2px; right: -14px; display: flex; gap: 4px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 8px; }
.think::after { content: ""; position: absolute; bottom: -12px; left: 8px; width: 8px; height: 8px; border: 3px solid var(--ink); border-radius: 50%; background: #fff; }
.think i { width: 6px; height: 6px; background: var(--ink); border-radius: 50%; animation: dots 1s infinite; }
.think i:nth-child(2) { animation-delay: .15s; } .think i:nth-child(3) { animation-delay: .3s; }
.sparks { inset: 0; }
.sparks b { position: absolute; color: var(--near); font-size: 18px; animation: twinkle .8s ease-in-out infinite alternate; }

.buddy[data-mood="sad"] .cloud, .buddy[data-mood="sad"] .rain { opacity: 1; }
.buddy[data-mood="sad"] .sprite { filter: saturate(.55) brightness(.95); transform: translateY(3px); }
.buddy[data-mood="think"] .think { opacity: 1; }
.buddy[data-mood="joy"] .sparks { opacity: 1; }
.buddy[data-mood="joy"] .sprite { animation: jump .45s ease-in-out 4; }
@keyframes drop { from { transform: translateY(0); opacity: 1; } to { transform: translateY(34px); opacity: 0; } }
@keyframes dots { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes jump { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-22px); } }
@keyframes twinkle { from { transform: scale(.7) rotate(-10deg); } to { transform: scale(1.2) rotate(10deg); } }

/* buddy maker */
.maker { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: start; }
.maker .preview { display: grid; justify-items: center; gap: 10px; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 16px; }
.maker .preview canvas { width: 156px; height: 288px; image-rendering: pixelated; }
.opts { display: grid; gap: 14px; min-width: 0; }
.opt { display: grid; gap: 6px; }
.opt > label, .opt > span { font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.chip { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font: 700 14px var(--body); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: #ffe3ec; }
.text-in { font: 700 16px var(--body); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; width: 100%; max-width: 260px; background: #fff; }
.text-in:focus, .swatch:focus-visible, .chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }

/* quordle */
.boards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 460px; justify-self: center; }
.board { display: grid; gap: 3px; padding: 6px; border-radius: 12px; border: 2px solid var(--line); background: #fff; }
.board.solved { border-color: var(--hit); }
.tally { display: grid; grid-template-columns: repeat(4, 34px); gap: 6px; justify-content: center; }
.tally span { height: 30px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--soft); }
.tally span.ok { background: var(--hit); border-color: var(--hit); color: #fff; }
.tally span.lost { border-color: var(--accent); color: var(--accent); }
.board.lost { border-color: #f1b8bf; }
.answer-row { margin-top: 4px; }
.tile.answer { background: #fde6e8; border-color: var(--accent); color: var(--accent); }

.row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.tile { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 6px; border: 2px solid var(--line);
  font-weight: 800; font-size: clamp(13px, 3.2vw, 19px); text-transform: uppercase; background: #fff; color: var(--ink); }
.tile.typing { border-color: var(--soft); }
.tile.hit { background: var(--hit); border-color: var(--hit); color: #fff; }
.tile.near { background: var(--near); border-color: var(--near); color: var(--ink); }
.tile.miss { background: var(--miss); border-color: var(--miss); color: var(--ink); }
.tile.flip { animation: flip .45s ease both; }
.row.shake { animation: shake .35s; }
@keyframes flip { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
@keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

.status { text-align: center; font-weight: 700; color: var(--soft); min-height: 1.4em; }
.keyboard { display: grid; gap: 6px; user-select: none; }
.krow { display: flex; justify-content: center; gap: 4px; }
.key { flex: 1 1 0; max-width: 46px; height: 50px; border: 0; border-radius: 8px; font: 800 15px var(--body); color: var(--ink);
  text-transform: uppercase; cursor: pointer; position: relative; overflow: hidden; background: #f1ecef; padding: 0; }
.key.wide { max-width: 72px; flex-grow: 1.6; font-size: 12px; }
.key .q { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.key .q i.hit { background: var(--hit); } .key .q i.near { background: var(--near); } .key .q i.miss { background: var(--miss); }
.key span { position: relative; }
.key:focus-visible { outline: 3px solid var(--accent); }
.key:active { transform: translateY(1px); }

.win { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 18px; border-radius: 18px; background: #fff; border: 2px dashed var(--accent); }
.win h3 { font-family: var(--display); font-weight: 400; font-size: 32px; margin: 0; color: var(--accent); }
.win .msg { color: var(--ink); max-width: 46ch; }
.reveal { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.reveal b { background: var(--hit); color: #fff; border-radius: 8px; padding: 4px 10px; letter-spacing: .1em; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font: 800 14px var(--body); background: var(--accent); color: #fff; cursor: pointer; }
.btn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }
/* final cut */
.fc { display: grid; gap: 16px; justify-items: center; text-align: center; }
.fc-meta { display: flex; justify-content: space-between; width: 100%; max-width: 460px; color: var(--soft); font-weight: 700; }
.fc-clock { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 800; }
.fc-dots { display: flex; gap: 6px; }
.fc-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.fc-dots i.ok { background: var(--hit); } .fc-dots i.skip { background: var(--accent); } .fc-dots i.now { background: var(--ink); }
.fc-cut { font-family: var(--display); font-size: clamp(34px, 8vw, 60px); letter-spacing: .12em; line-height: 1.1; word-break: break-all; max-width: 100%; padding: 18px 10px; }
.fc-cut.shake { animation: shake .35s; }
.fc-form { display: grid; gap: 10px; justify-items: center; width: 100%; }
.fc-in { max-width: 420px; text-align: center; font-size: 18px; }
.fc-example { display: grid; gap: 2px; justify-items: center; padding: 10px 0; }
.fc-example .fc-cut { font-size: clamp(28px, 6vw, 44px); padding: 0; }
.fc-arrow { color: var(--soft); } .fc-title { font-family: var(--display); font-size: 24px; color: var(--soft); }
.fc-small { font-size: 14px; }
.fc-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; width: 100%; max-width: 440px; text-align: left; }
.fc-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 10px; background: var(--tint); }
.fc-list li.ok span:first-child { color: var(--hit); font-weight: 800; } .fc-list li.skip span:first-child { color: var(--accent); font-weight: 800; }
.fc-sk { font-family: var(--display); letter-spacing: .08em; color: var(--soft); overflow-wrap: anywhere; }
/* name that tune */
.nt { display: grid; gap: 14px; width: 100%; max-width: 560px; justify-self: center; }
.nt-top { display: flex; justify-content: space-between; align-items: baseline; color: var(--soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.nt-score b { color: var(--ink); font-size: 18px; }
.nt-worth { text-align: center; display: grid; gap: 2px; }
.nt-lbl { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
.nt-big { font-size: clamp(40px, 9vw, 56px); font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.nt-wave { position: relative; height: 84px; display: flex; align-items: center; gap: 2px; padding: 0 2px; border-left: 2px solid var(--line); }
.nt-wave i { flex: 1 1 0; min-width: 0; background: var(--line); border-radius: 1px; transition: background .15s; }
.nt-wave i.on { background: #b9b0b5; }
.nt-wave i.now { background: var(--hit); }
.nt-head { position: absolute; top: -6px; bottom: -6px; left: 0; width: 2px; background: var(--ink); border-radius: 2px; }
.nt-head::before { content: ""; position: absolute; top: -4px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.nt-times { display: flex; justify-content: space-between; color: var(--soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.nt-times b { color: var(--ink); }
.nt-chips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.nt-chip { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 14px; font: 800 15px var(--body); color: var(--soft); cursor: pointer; font-variant-numeric: tabular-nums; }
.nt-chip[aria-pressed="true"] { background: var(--tint); color: var(--ink); border-color: var(--ink); }
.nt-chip:disabled { opacity: .35; cursor: default; }
.nt-row { display: flex; gap: 10px; }
.nt-play { flex: 1 1 auto; border: 0; border-radius: 14px; padding: 18px; font: 800 17px var(--body); background: var(--hit); color: #fff; cursor: pointer; }
.nt-play.playing { background: #5f9b45; }
.nt-side { flex: 0 0 auto; min-width: 64px; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 0 16px; font: 800 16px var(--body); color: var(--ink); cursor: pointer; }
.nt-side:disabled { opacity: .35; cursor: default; }
.nt-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; }
.nt-form .text-in { max-width: none; }
.nt-form.shake { animation: shake .35s; }
.nt-reveal { text-align: center; display: grid; gap: 2px; padding: 14px; border-radius: 16px; background: var(--tint); }
.nt-rt { font-family: var(--display); font-size: 28px; } .nt-ra { color: var(--soft); font-weight: 700; } .nt-rnote { margin-top: 6px; }
.nt-chip:focus-visible, .nt-play:focus-visible, .nt-side:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.nt-list li { grid-template-columns: 22px minmax(0, 1fr) auto; }
.nt-li { display: grid; color: var(--ink); } .nt-li b { font-weight: 700; } .nt-li small { color: var(--soft); font-size: 13px; }
@media (max-width: 520px) { .nt-form { grid-template-columns: minmax(0, 1fr); } }
/* pet theo */
.pt { display: grid; gap: 12px; width: 100%; max-width: 480px; justify-self: center; }
.pt-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 8px; }
.pt-leg { display: grid; justify-items: center; text-align: center; gap: 2px; font-size: 12px; color: var(--soft); }
.pt-leg img { width: 56px; height: auto; image-rendering: pixelated; }
.pt-leg b { color: var(--ink); font-size: 13px; }
.pt-small { font-size: 14px; }
.pt-hud { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.pt-hearts { color: var(--accent); font-size: 22px; letter-spacing: 2px; }
.pt-score { font-size: 28px; } .pt-time { color: var(--soft); font-size: 20px; min-width: 2ch; text-align: right; }
.pt-time::after { content: "s"; font-size: 14px; }
.pt-meter { position: relative; height: 18px; border-radius: 999px; background: var(--tint); overflow: hidden; border: 1.5px solid var(--line); }
.pt-meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #f2c58f, #e89a9a); transition: width .2s; }
.pt-meter span { position: relative; display: block; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; line-height: 15px; color: var(--ink); }
.pt-board { position: relative; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.pt-top { position: relative; height: 60px; overflow: hidden; border-bottom: 10px solid #7a4e2d; border-radius: 6px 6px 0 0; }
.pt-zoom { position: absolute; bottom: -6px; left: 0; width: 76px; image-rendering: pixelated; cursor: pointer; }
.pt-cab { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; background: #9a6638; border-radius: 0 0 14px 14px;
  box-shadow: inset 0 0 0 4px #7a4e2d, 0 12px 24px -16px rgba(60,30,10,.6); perspective: 600px; }
.pt-cubby { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 6px; overflow: hidden; cursor: pointer;
  background: radial-gradient(ellipse at 50% 120%, #4a2e1c, #2a170d 70%); box-shadow: inset 0 6px 10px rgba(0,0,0,.5); }
.pt-cubby img { position: absolute; left: 50%; bottom: 0; width: 84%; image-rendering: pixelated; transform: translate(-50%, 100%); transition: transform .16s ease-out; pointer-events: none; }
.pt-cubby.open img { transform: translate(-50%, 6%); }
.pt-door { position: absolute; inset: 0; background: linear-gradient(135deg, #c48a52, #a8703f); border: 3px solid #7a4e2d; border-radius: 6px;

function shade(hex, f) { // f<0 darker, f>0 lighter
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;

  r = Math.round(r + (t - r) * a); g = Math.round(g + (t - g) * a); b = Math.round(b + (t - b) * a);
  return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function buddyGrid(c, mood, blink) {

function paintGrid(canvas, grid, scale = 8) {
  const w = grid[0].length, h = grid.length;
  canvas.width = w * scale; canvas.height = h * scale;
  const x = canvas.getContext("2d"); x.clearRect(0, 0, canvas.width, canvas.height);
  grid.forEach((row, j) => row.forEach((col, i) => { if (col) { x.fillStyle = col; x.fillRect(i * scale, j * scale, scale, scale); } }));
}

    <div class="namebar"><span class="bname">${escapeHtml(cfg.name || "Buddy")}</span><button class="edit-buddy" type="button">Edit buddy</button></div>
  </aside>`;
  const el = $(".buddy", host), sprite = $(".sprite", el);
  paintGrid($(".cloud", el), cloudGrid(), 6);
  $(".edit-buddy", el).onclick = onEdit;
  let mood = "idle", revert = null;
  const draw = (blink = false) => paintGrid(sprite, buddyGrid(cfg, mood, blink), 5);
  draw();
  const blinker = setInterval(() => { if (mood === "idle") { draw(true); setTimeout(() => draw(), 140); } }, 3600);
  return {
    el,
    say(m, text, { hold = true, burst = false } = {}) {
      clearTimeout(revert);
      mood = m; el.dataset.mood = m; draw();
      $(".bubble", el).textContent = text;
      if (m === "joy") { el.dataset.mood = "idle"; void sprite.offsetWidth; el.dataset.mood = "joy"; }
      if (burst) { const r = sprite.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 3, burst === "big" ? 160 : 60); }
      if (!hold) revert = setTimeout(() => this.say("idle", "Keep going, you've got this!"), 2800);
    },
    destroy() { clearInterval(blinker); clearTimeout(revert); },
  };
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ============================================================
   DAYS & ROUTING
   ============================================================ */
function realDay(now = new Date()) {
  const start = new Date(CONFIG.year, CONFIG.month - 1, 1);   // Nov 1, local midnight
  if (now < start) return 0;                                  // before: nothing to blow yet
  const n = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - start) / 864e5) + 1;
  return Math.min(n, 10);                                     // 10 and after: the cake
}
function previewDay() {                                       // secret preview link: #day-3 pretends it's Nov 3
  const m = location.hash.match(/^#day-(\d+)$/);
  return m ? Math.max(1, Math.min(10, +m[1])) : null;
}
const PV = () => previewDay();
const currentDay = () => PV() ?? realDay();
const BLOWN_KEY = () => PV() ? "bday-blown-preview" : "bday-blown";
const blown = () => new Set(store.get(BLOWN_KEY()) || []);
function markBlown(d) { const b = blown(); b.add(d); store.set(BLOWN_KEY(), [...b]); }

let viewing = null;      // null = home (the candles)
let buddy = null;

const CANDLES = [   // fill, height tweak, flame tilt — in the artwork's order
  ["st-red", 0, -4], ["dt-purple", 2, 3], ["st-yellow", -4, -2], ["dt-green", 4, 5], ["st-blue", -2, -3],
  ["st-red", 0, 2], ["dt-purple", 2, -4], ["st-yellow", -4, 3], ["dt-green", 4, -2], ["st-blue", -2, 4],
];
function candleSVG([fill, dy, tilt]) {
  const top = 40 + dy, h = 96 - dy;
  return `<svg viewBox="0 0 34 140" aria-hidden="true">
    <ellipse class="glow" cx="17" cy="${top - 18}" rx="17" ry="20" fill="url(#gl)" style="transform-origin:17px ${top - 18}px;transform-box:view-box"/>
    <g class="smoke" style="transform-box:view-box"><path d="M17 ${top - 6} q-5 -7 0 -13 q5 -6 0 -13" stroke="#b8b0b5" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    <line x1="17" y1="${top - 6}" x2="17" y2="${top}" stroke="#4a3f44" stroke-width="2" stroke-linecap="round"/>
    <g style="transform:rotate(${tilt}deg);transform-origin:17px ${top - 5}px;transform-box:view-box">
      <path class="flame" style="transform-origin:17px ${top - 5}px" d="M17 ${top - 32} C 23 ${top - 22}, 25 ${top - 14}, 17 ${top - 5} C 9 ${top - 14}, 11 ${top - 22}, 17 ${top - 32} Z" fill="url(#fl)"/>
    </g>
    <rect x="6" y="${top}" width="22" height="${h}" rx="5" fill="url(#${fill})"/>
  </svg>`;
}

function route() {
  const view = $("#view");
  view.innerHTML = ""; stopClock(); clearInterval(fcTimer); stopTune(); stopPetTheo(); buddy?.destroy(); buddy = null; document.onkeydown = null;
  if (viewing == null) return renderHome(view);
  if (!loadBuddy()) return renderMaker(view, route);          // buddy is made before any game
  if (viewing === 10) { location.href = PV() ? "index.html?peek" : "index.html"; return; }   // the cake page that's already built
  if (viewing === 1) return renderDay1(view, PV());
  if (viewing === 2) return renderDay2(view, PV());
  if (viewing === 4) return renderDay4(view, PV());
  if (viewing === 6) return renderDay6(view, PV());
  return renderPlaceholder(view, viewing, PV());
}

/* ---------- home: blow one candle a day ---------- */
let clockTimer = null;
function stopClock() { clearInterval(clockTimer); }
const DATE = d => `Nov ${d}`;

function renderHome(view) {
  const today = currentDay(), done = blown(), pv = PV();
  const ready = d => d <= today && !done.has(d);
  view.innerHTML = `<section class="home">
    ${pv ? `<div class="preview-note">Preview: pretending it's ${DATE(pv)} · <button id="pv-reset" type="button">relight the candles</button></div>` : ""}
    <p class="pre">a countdown to</p>
    <h1>${escapeHtml(CONFIG.name)}'s ${escapeHtml(CONFIG.age)}</h1>
    <div class="cake-row" id="cakes"></div>
    <div class="hint" id="hint" aria-live="polite"></div>
  </section>`;
  if (pv) $("#pv-reset").onclick = () => { store.del(BLOWN_KEY()); route(); };

  const row = $("#cakes");
  CANDLES.forEach((c, i) => {
    const d = i + 1, b = document.createElement("button");
    b.type = "button";
    b.className = "candle " + (done.has(d) ? "blown" : ready(d) ? "ready" : "locked");
    b.setAttribute("aria-label", done.has(d) ? `Day ${d}: ${CONFIG.days[d]} (play again)` : ready(d) ? `Blow out candle ${d}` : `Candle ${d}: not yet`);
    b.innerHTML = candleSVG(c) + `<span class="day">${d === 10 ? "🎂" : d}</span>`;
    b.onclick = () => tapCandle(b, d);
    row.appendChild(b);
  });

  let nudgeT = null;
  function tapCandle(b, d) {
    if (done.has(d)) { viewing = d; return route(); }
    if (!ready(d)) {
      b.classList.remove("nope"); void b.offsetWidth; b.classList.add("nope");
      setHint(`Not yet! This one's for ${DATE(d)}.`, "", true);
      clearTimeout(nudgeT); nudgeT = setTimeout(() => { const [l, sub] = msg(); setHint(l, sub, false); }, 2400);
      return;
    }
    if (b.classList.contains("blowing")) return;
    b.classList.remove("ready"); b.classList.add("blowing");
    markBlown(d);
    setHint(d === 10 ? "Happy birthday!" : "Whoosh!", "", false);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(() => { viewing = d; route(); scrollTo(0, 0); }, reduce ? 150 : 1300);
  }

  function setHint(line, sub, nudge) {
    $("#hint").innerHTML = `<div class="line ${nudge ? "nudge" : ""}">${line}</div>${sub ? `<div class="clockline" id="clk">${sub}</div>` : ""}`;
  }

  // default message + countdown to the next candle
  const pad = n => String(n).padStart(2, "0");
  const untilNext = () => {
    if (pv) return "";
    const now = new Date(), next = today === 0 ? new Date(CONFIG.year, CONFIG.month - 1, 1) : new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    let s = Math.max(0, Math.floor((next - now) / 1000)); const dd = Math.floor(s / 86400); s %= 86400;
    return (dd ? dd + "d " : "") + `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`;
  };
  const waiting = [...Array(10)].map((_, i) => i + 1).filter(ready);
  const msg = () => {
    if (today === 0) return ["The first candle is ready at midnight.", untilNext()];
    if (waiting.length) return [waiting.length > 1 ? `${waiting.length} candles are waiting to be blown.` : "Make a wish and blow today's candle.", ""];
    if (today >= 10) return ["Happy birthday, " + CONFIG.name + "!", ""];
    return ["That's today's candle. The next one lights at midnight.", untilNext()];
  };
  const tick = () => { const [l, sub] = msg(); if (!$("#hint .nudge")) setHint(l, sub, false); else { const c = $("#clk"); if (c) c.textContent = sub; } };
  tick(); clockTimer = setInterval(tick, 1000);
}

/* stage = buddy + game area; returns the game element */
function stage(view, pv, title, intro, extraNote = "") {
  view.innerHTML = `<div class="topbar"><button class="back" id="back" type="button">← Back to the candles</button><span class="mark">${escapeHtml(CONFIG.name)}'s ${escapeHtml(CONFIG.age)}</span></div>
    <section class="card" style="margin-top:12px">

    <div class="stage"><div id="buddy-slot"></div><div class="game"><h2>${title}</h2>${intro ? `<p>${intro}</p>` : ""}<div id="game"></div></div></div>

/* ---------- Day 1: Quordle ---------- */
function score(guess, answer) {
  const res = Array(5).fill("miss"), left = {};
  for (let i = 0; i < 5; i++) guess[i] === answer[i] ? res[i] = "hit" : left[answer[i]] = (left[answer[i]] || 0) + 1;
  for (let i = 0; i < 5; i++) if (res[i] !== "hit" && left[guess[i]]) { res[i] = "near"; left[guess[i]]--; }
  return res;
}
const chunk5 = s => s.match(/.{5}/g);
let WORDS = null;
function words() {
  if (!WORDS) { const a = chunk5(ANSWERS_RAW); WORDS = { answers: a, valid: new Set([...a, ...chunk5(GUESSES_RAW)]) }; }
  return WORDS;
}
function freshAnswers() {
  const a = words().answers, pick = new Set();
  while (pick.size < 4) pick.add(a[Math.random() * a.length | 0].toUpperCase());
  return [...pick];
}

let quordleGame = null;
function renderDay1(view, pv) {
  // four random words, new every time the page is opened (kept while he moves around the site, never saved)
  const MAX = 9;
  if (!quordleGame) quordleGame = { answers: freshAnswers(), guesses: [] };
  const st = quordleGame;
  const W = st.answers;
  let cur = "", lastFlip = -1;

  const game = stage(view, pv, "Day 1 · Quordle", "Guess all four words in 9 tries. Every guess goes into all four boards.",
    ` · <a href="#" id="reset">new words</a>`);
  game.innerHTML = `<div style="display:grid;gap:14px">
    <div class="tally" id="tally" aria-label="Boards solved"></div>
    <div class="boards" id="boards"></div>
    <div class="status" id="status" aria-live="polite"></div><div id="end"></div><div class="keyboard" id="kb"></div></div>`;
  if (pv) $("#reset").onclick = e => { e.preventDefault(); quordleGame = null; route(); };

  const solvedAt = () => W.map(w => st.guesses.indexOf(w));
  const won = () => solvedAt().every(i => i >= 0);
  const over = () => won() || st.guesses.length >= MAX;

  function draw() {
    const sa = solvedAt(), boards = $("#boards"), done = over();
    $("#tally").innerHTML = W.map((w, b) => `<span class="${sa[b] >= 0 ? "ok" : done ? "lost" : ""}">${sa[b] >= 0 ? sa[b] + 1 : done ? "✕" : ""}</span>`).join("");
    boards.innerHTML = "";
    W.forEach((w, b) => {
      const el = document.createElement("div");
      el.className = "board" + (sa[b] >= 0 ? " solved" : done ? " lost" : "");
      el.setAttribute("aria-label", `Board ${b + 1}`);
      for (let r = 0; r < MAX; r++) {
        const row = document.createElement("div"); row.className = "row";
        const g = st.guesses[r];
        const showGuess = g && (sa[b] < 0 || r <= sa[b]);
        const typing = !done && sa[b] < 0 && r === st.guesses.length;
        const marks = showGuess ? score(g, w) : null;
        for (let i = 0; i < 5; i++) {
          const t = document.createElement("div"); t.className = "tile";
          if (showGuess) { t.textContent = g[i]; t.classList.add(marks[i]); if (r === lastFlip) { t.classList.add("flip"); t.style.animationDelay = i * 80 + "ms"; } }
          else if (typing && cur[i]) { t.textContent = cur[i]; t.classList.add("typing"); }
          row.appendChild(t);
        }
        if (typing) row.dataset.typing = "";
        el.appendChild(row);
      }
      if (done && sa[b] < 0) {                                   // lost: the answer goes under the board's guesses
        const row = document.createElement("div"); row.className = "row answer-row";
        row.innerHTML = [...w].map(ch => `<div class="tile answer">${ch}</div>`).join("");
        el.appendChild(row);
      }
      boards.appendChild(el);
    });
    drawKeys();
    const left = MAX - st.guesses.length;
    if (!done) $("#status").textContent = `${left} guess${left === 1 ? "" : "es"} left`;
    if (done) finish();
  }

  function drawKeys() {
    const sa = solvedAt(), rank = { hit: 3, near: 2, miss: 1 };
    const kb = $("#kb"); kb.innerHTML = "";
    ["QWERTYUIOP", "ASDFGHJKL", "+ZXCVBNM-"].forEach(line => {
      const row = document.createElement("div"); row.className = "krow";
      [...line].forEach(ch => {
        const k = document.createElement("button"); k.className = "key"; k.type = "button";
        if (ch === "+") { k.classList.add("wide"); k.innerHTML = "<span>Enter</span>"; k.onclick = submit; }
        else if (ch === "-") { k.classList.add("wide"); k.innerHTML = "<span>⌫</span>"; k.onclick = back; k.setAttribute("aria-label", "Delete"); }
        else {
          const quads = W.map((w, b) => {
            if (sa[b] >= 0) return "";
            let best = "";
            st.guesses.forEach(g => score(g, w).forEach((m, i) => { if (g[i] === ch && (!best || rank[m] > rank[best])) best = m; }));
            return best;
          });
          k.innerHTML = `<span class="q">${quads.map(q => `<i class="${q}"></i>`).join("")}</span><span>${ch}</span>`;
          k.onclick = () => type(ch);
        }
        row.appendChild(k);
      });
      kb.appendChild(row);
    });
  }

  function shake(msg) {
    $("#status").textContent = msg;
    document.querySelectorAll("[data-typing]").forEach(r => { r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake"); });
  }
  function type(ch) { if (over() || cur.length >= 5) return; cur += ch; lastFlip = -1; draw(); }
  function back() { if (over()) return; cur = cur.slice(0, -1); lastFlip = -1; draw(); }
  function submit() {
    if (over()) return;
    if (cur.length < 5) return shake("Not enough letters");
    if (!words().valid.has(cur.toLowerCase())) { shake("Not in word list"); buddy.say("think", "Hmm… is that a word?", { hold: false }); return; }
    const before = solvedAt().filter(i => i >= 0).length;
    const guess = cur;
    st.guesses.push(guess); lastFlip = st.guesses.length - 1; cur = "";
    draw();
    react(guess, before);
  }

  // buddy reactions to each guess
  function react(guess, before) {
    const sa = solvedAt(), after = sa.filter(i => i >= 0).length, left = MAX - st.guesses.length;
    if (won() || over()) return;                                 // finish() handles the ending
    if (after > before) return buddy.say("joy", after - before > 1 ? "TWO at once?! Amazing!" : `Got one! ${4 - after} to go!`, { hold: false, burst: true });
    let best = 0, anyHit = 0, anyNear = 0;
    W.forEach((w, b) => { if (sa[b] >= 0) return; const m = score(guess, w); const h = m.filter(x => x === "hit").length, n = m.filter(x => x === "near").length;
      best = Math.max(best, h + n * .5); anyHit += h; anyNear += n; });
    if (best >= 3.5) return buddy.say("think", left === 1 ? "Last guess… so, so close!" : "Ooh… so close. Thinking…");
    if (anyHit === 0 && anyNear <= 1) return buddy.say("sad", "Oh no… nothing there.");
    buddy.say("idle", left <= 2 ? `${left} left… we can do this!` : "Some clues! Keep going.");
  }

  function finish() {
    const w = won(), n = solvedAt().filter(i => i >= 0).length;
    $("#kb").hidden = true; $("#status").textContent = "";
    $("#end").innerHTML = `<div class="win">
      <h3>${w ? "You got all four!" : `${n} of 4`}</h3>
      <p class="msg">${w ? `Solved in ${st.guesses.length} guesses.` : n ? "So close! The missing words are under their boards." : "Not this time. The words are under each board."}</p>
      <div class="row-btns" style="justify-content:center"><button class="btn" id="again" type="button">Play again</button></div>
      <p class="msg"><strong>Tomorrow's candle lights at midnight.</strong></p>
    </div>`;
    $("#again").onclick = () => { quordleGame = null; route(); };
    if (w) buddy.say("joy", "WE DID IT!! 🎉", { burst: lastFlip >= 0 ? "big" : false });
    else buddy.say("sad", n ? `${n} out of 4… next time!` : "Aww… next time!");
  }

  document.onkeydown = e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input")) return;
    if (e.key === "Enter") { e.preventDefault(); submit(); }
    else if (e.key === "Backspace") back();
    else if (/^[a-z]$/i.test(e.key)) type(e.key.toUpperCase());
  };
  if (!over()) buddy.say("idle", st.guesses.length ? "Welcome back! Let's finish this." : "Let's find those words!");
  draw();
}

/* ---------- Day 2: Final Cut ---------- */
const MOVIES = [ // his ten, shuffled each time the page opens. extra spellings that also count go after the title
  ["Main Hoon Na"], ["Fallen Angels"], ["A Separation"], ["Four Lions"], ["In Bruges"],
  ["No Other Choice", "No Other Choices"], ["Eternity"], ["Mamma Mia!", "Mama Mia"],
  ["Heat"], ["Soul"],
];
const skeleton = t => t.toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/[AEIOU]/g, "");
const norm = t => t.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
const fmtTime = ms => { const t = Math.floor(ms / 100); return `${String(Math.floor(t / 600)).padStart(2, "0")}:${String(Math.floor(t / 10) % 60).padStart(2, "0")}.${t % 10}`; };
let finalCutGame = null;
let fcTimer = null;

function renderDay2(view, pv) {
  if (!finalCutGame) {
    const pool = MOVIES.slice(); for (let i = pool.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
    finalCutGame = { movies: pool.slice(0, 10).map(m => m[0]), i: 0, results: [], start: null, end: null };
  }
  const st = finalCutGame;
  const game = stage(view, pv, "Day 2 · Final Cut",
    "Ten movie titles with every vowel and space cut out. Type the full title. The clock runs until the last one.",
    ` · <a href="#" id="reset">new movies</a>`);
  if (pv) $("#reset").onclick = e => { e.preventDefault(); finalCutGame = null; clearInterval(fcTimer); route(); };
  clearInterval(fcTimer);

  const draw = () => {
    if (st.end) return finish();
    if (!st.start) {
      game.innerHTML = `<div class="fc">
        <div class="fc-meta"><span>10 movies</span><span class="fc-clock">00:00.0</span></div>
        <div class="fc-example"><div class="fc-cut">THGDFTHR</div><div class="fc-arrow">↓</div><div class="fc-title">The Godfather</div></div>
        <div class="row-btns" style="justify-content:center"><button class="btn" id="fc-start" type="button">Start game</button></div>
        <p class="fc-small">You can skip a movie, but you can't go back.</p></div>`;
      $("#fc-start").onclick = () => { st.start = Date.now(); draw(); };
      buddy.say("idle", "Movie night! Ready?");
      return;
    }
    const movie = st.movies[st.i];
    game.innerHTML = `<div class="fc">
      <div class="fc-meta"><span>Movie <b>${st.i + 1}</b> of 10</span><span class="fc-clock" id="fc-clock">${fmtTime(Date.now() - st.start)}</span></div>
      <div class="fc-dots">${st.movies.map((_, k) => `<i class="${k < st.results.length ? (st.results[k].ok ? "ok" : "skip") : k === st.i ? "now" : ""}"></i>`).join("")}</div>
      <div class="fc-cut" id="fc-cut" aria-label="Title with vowels and spaces removed">${skeleton(movie)}</div>
      <form class="fc-form" id="fc-form" autocomplete="off">
        <input class="text-in fc-in" id="fc-in" placeholder="Type the movie title" aria-label="Your guess" autocapitalize="words" spellcheck="false">
        <div class="row-btns"><button class="btn" type="submit">Guess</button><button class="btn ghost" type="button" id="fc-skip">Skip movie</button></div>
      </form>
      <div class="status" id="fc-status" aria-live="polite"></div></div>`;
    const input = $("#fc-in"); input.focus({ preventScroll: true });
    fcTimer = setInterval(() => { const c = $("#fc-clock"); if (c) c.textContent = fmtTime(Date.now() - st.start); else clearInterval(fcTimer); }, 100);
    $("#fc-form").onsubmit = e => {
      e.preventDefault();
      const g = norm(input.value); if (!g) return;
      const alts = (MOVIES.find(m => m[0] === movie) || [movie]);
      const answers = alts.flatMap(t => [norm(t), norm(t.replace(/^(the|a)\s+/i, ""))]);
      if (answers.includes(g) || answers.includes(g.replace(/^the/, ""))) return next(true);
      const dist = Math.min(...answers.map(a => lev(g, a)));
      const cut = $("#fc-cut"); cut.classList.remove("shake"); void cut.offsetWidth; cut.classList.add("shake");
      if (dist <= Math.max(1, Math.floor(answers[0].length * .2))) { $("#fc-status").textContent = "So close. Check the spelling."; buddy.say("think", "Ooh… nearly! Spelling?"); }
      else { $("#fc-status").textContent = "Not that one."; buddy.say("sad", "Hmm… not that one."); }
      input.select();
    };
    $("#fc-skip").onclick = () => next(false);
  };

  function next(ok) {
    clearInterval(fcTimer);
    const movie = st.movies[st.i];
    st.results.push({ movie, ok }); st.i++;
    if (st.i >= st.movies.length) { st.end = Date.now(); }
    const got = st.results.filter(r => r.ok).length;
    if (ok) buddy.say("joy", st.end ? "That's a wrap! 🎬" : `Yes! ${movie}!`, { hold: !!st.end, burst: st.end && got >= 7 ? "big" : true });
    else buddy.say("sad", `It was ${movie}…`, { hold: !!st.end });
    if (!st.end) { draw(); $("#fc-status").textContent = ok ? `✓ ${movie}` : `Skipped: it was ${movie}`; }

  function finish(fresh) {
    const got = st.results.filter(r => r.ok).length, time = fmtTime(st.end - st.start);
    game.innerHTML = `<div class="fc"><div class="win">
      <h3>${got} of 10</h3>
      <p class="msg">in <b class="fc-clock">${time}</b></p>
      <ol class="fc-list">${st.results.map(r => `<li class="${r.ok ? "ok" : "skip"}"><span>${r.ok ? "✓" : "✕"}</span><span class="fc-sk">${skeleton(r.movie)}</span><span>${escapeHtml(r.movie)}</span></li>`).join("")}</ol>
      <div class="row-btns" style="justify-content:center"><button class="btn" id="fc-again" type="button">Play again</button></div>
      <p class="msg"><strong>Tomorrow's candle lights at midnight.</strong></p></div></div>`;
    $("#fc-again").onclick = () => { finalCutGame = null; route(); };
    if (!fresh) buddy.say(got >= 5 ? "joy" : "sad", got >= 5 ? `${got} out of 10! Nice!` : `${got} out of 10… rematch?`);

  }
  draw();
}

const SONGS = [ // file in audio/, title, artist, extra spellings that also count
  { file: "ode-to-the-mets", title: "Ode to the Mets", artist: "The Strokes", titleAlts: [], artistAlts: ["Strokes"] },

  { file: "aankhen-milaney-waaley", title: "Aankhen Milaney Waaley", artist: "Nazia Hassan & Zoheb Hassan", titleAlts: ["Aankhen Milane Wale", "Ankhen Milaney Waley", "Aankhein Milane Waale"], artistAlts: ["Nazia Hassan", "Zoheb Hassan", "Nazia and Zoheb", "Nazia & Zoheb", "Nazia Zoheb Hassan"] },
  { file: "champagne-problems", title: "champagne problems", artist: "Taylor Swift", titleAlts: [], artistAlts: ["Taylor"] },
  { file: "almost-sweet-music", title: "Almost (Sweet Music)", artist: "Hozier", titleAlts: ["Almost", "Sweet Music", "Almost Sweet Music"], artistAlts: [] },
];
const CLIP_STEPS = [0.5, 1, 2, 5];        // what he can hear before guessing (never more than 5s)
const CLIP_FULL = 15;                     // the whole clip plays once the song is revealed
const MAX_LISTEN = 5;
const worthFor = len => Math.max(2000, Math.round((10000 - (len - CLIP_STEPS[0]) / (MAX_LISTEN - CLIP_STEPS[0]) * 8000) / 100) * 100);
const fmtN = n => n.toLocaleString("en-US");
const fmtS = s => (s < 1 ? s.toFixed(2) : s % 1 ? s.toFixed(1) : s.toFixed(1)) + "s";
function matches(guess, options) {
  const g = norm(guess.replace(/\(.*?\)/g, " ")); if (!g) return false;
  return options.some(o => { const a = norm(o.replace(/\(.*?\)/g, " ")) || norm(o); const b = norm(o);
    return [a, b].some(x => x === g || (x.length > 4 && lev(g, x) <= Math.max(1, Math.floor(x.length * .2)))); });
}
let tuneGame = null;
let tuneAudio = null, tuneStop = null, tuneRaf = 0;
function stopTune() { if (tuneAudio) { tuneAudio.pause(); } clearTimeout(tuneStop); cancelAnimationFrame(tuneRaf); }

function renderDay4(view, pv) {
  if (!tuneGame) {
    const order = SONGS.map((_, i) => i); for (let i = order.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [order[i], order[j]] = [order[j], order[i]]; }
    tuneGame = { order, i: 0, len: CLIP_STEPS[0], score: 0, results: [], phase: "guess" };
  }
  const st = tuneGame;
  const game = stage(view, pv, "Day 4 · Name That Tune", "Five songs. Listen to as little as you dare, then name the song and the artist. The less you hear, the more it's worth.",
    ` · <a href="#" id="reset">restart</a>`);
  if (pv) $("#reset").onclick = e => { e.preventDefault(); stopTune(); tuneGame = null; route(); };

  function audioFor(song) {
    if (!tuneAudio || tuneAudio.dataset.file !== song.file) {
      stopTune(); tuneAudio = new Audio(`audio/${song.file}.mp3`); tuneAudio.preload = "auto"; tuneAudio.dataset.file = song.file;
    }
    return tuneAudio;
  }

  function draw() {
    if (st.i >= st.order.length) return finish();
    const song = SONGS[st.order[st.i]], all = (TUNE_PEAKS[song.file] || []);
    const reveal = st.phase !== "guess", worth = worthFor(st.len);
    const span = reveal ? CLIP_FULL : MAX_LISTEN;
    const per = all.length / CLIP_FULL;
    const peaks = reveal ? Array.from({ length: Math.ceil(all.length / 3) }, (_, k) => Math.max(...all.slice(k * 3, k * 3 + 3)))
                         : (pk => { const m = Math.max(...pk, .01); return pk.map(p => .15 + .85 * p / m); })(all.slice(0, Math.round(per * MAX_LISTEN)));
    game.innerHTML = `<div class="nt">
      <div class="nt-top"><span class="nt-score"><b>${fmtN(st.score)}</b> / ${fmtN(SONGS.length * 10000)}</span><span class="nt-count">${st.i + 1} / ${SONGS.length}</span></div>
      <div class="nt-worth"><div class="nt-lbl">${reveal ? "You scored" : "Worth now"}</div><div class="nt-big">${reveal ? "+" + fmtN(st.results[st.i]?.pts || 0) : fmtN(worth)}</div></div>
      <div class="nt-wave" id="nt-wave" aria-hidden="true">
        ${peaks.map((p, k) => { const t = (k + .5) / peaks.length * span; return `<i style="height:${Math.round(p * 100)}%" class="${t <= (reveal ? CLIP_FULL : st.len) ? "on" : ""}" data-t="${t.toFixed(2)}"></i>`; }).join("")}
        <span class="nt-head" id="nt-head"></span>
      </div>
      <div class="nt-times"><span>0s</span><b>${reveal ? fmtS(CLIP_FULL) : fmtS(st.len)}</b><span>${fmtS(span)}</span></div>
      ${reveal ? "" : `<div class="nt-chips" role="group" aria-label="How much to hear">${CLIP_STEPS.map(s => `<button type="button" class="nt-chip" data-s="${s}" aria-pressed="${s === st.len}" ${s < st.len ? "disabled" : ""}>${fmtS(s)}</button>`).join("")}</div>`}
      <div class="nt-row">
        <button class="nt-play" id="nt-play" type="button">▶ Play ${reveal ? "the song" : fmtS(st.len)}</button>
        ${reveal ? `<button class="nt-side" id="nt-next" type="button">${st.i + 1 < SONGS.length ? "Next song →" : "See score →"}</button>`
                 : `<button class="nt-side" id="nt-more" type="button" ${st.len >= MAX_LISTEN ? "disabled" : ""}>+ 1s</button><button class="nt-side" id="nt-skip" type="button" aria-label="Give up and reveal">⏭</button>`}
      </div>
      ${reveal ? `<div class="nt-reveal"><div class="nt-rt">${escapeHtml(song.title)}</div><div class="nt-ra">${escapeHtml(song.artist)}</div>

        : `<form class="nt-form" id="nt-form" autocomplete="off">

      const okT = matches(t, [song.title, ...song.titleAlts]), okA = matches(a, [song.artist, ...song.artistAlts]);

        const pts = okA ? worth : Math.round(worth * .6 / 100) * 100;

  }

  function play(len) {
    const song = SONGS[st.order[st.i]], a = audioFor(song);
    stopTune();

  function finish() {
    stopTune();
    game.innerHTML = `<div class="nt"><div class="win">

}

    };

      const b = $("#pt-board").getBoundingClientRect(), r = el.getBoundingClientRect();
      const f = document.createElement("span"); f.className = "pt-float " + (cls || ""); f.textContent = text;
      f.style.left = (r.left - b.left + r.width / 2) + "px"; f.style.top = (r.top - b.top + r.height * .25) + "px";
      $("#pt-board").appendChild(f); setTimeout(() => f.remove(), 900);
    };
    const banner = (t) => { const el = $("#pt-banner"); el.textContent = t; el.hidden = false; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); setTimeout(() => el.hidden = true, 1300); };
    const pet = (pts, el) => {
      S.score += pts; float(el, "+" + pts + " ♥", "good");
      if (S.gt < S.purrUntil) return;                          // pets during purr-fect mode don't build the next one
      S.combo++;
      if (S.combo >= PET.purrNeed && S.gt >= S.purrUntil) {
        S.purrUntil = S.gt + PET.purrFor; S.combo = 0; banner("PURR-FECT!");
        buddy.say("joy", "Purr-fect mode!! 💕", { hold: false, burst: true });
        cubbies.forEach((_, i) => { if (!S.slots[i] || !["theo", "sleepy"].includes(S.slots[i].type)) { hide(i); show(i, "theo", PET.purrFor); } });
      } else if (S.combo && S.combo % 5 === 0 && S.gt >= S.purrUntil) buddy.say("joy", `${S.combo} in a row! Theo's purring!`, { hold: false });
    };
    const ouch = (text) => { S.combo = 0; buddy.say("sad", text, { hold: false }); };

    cubbies.forEach((c, i) => c.addEventListener("pointerdown", e => {
      e.preventDefault(); if (S.over) return;
      const s = S.slots[i]; if (!s || s.done) return;
      if (s.type === "theo") { s.done = true; c.querySelector("img").src = theoSprite("petted"); pet(PET.points.theo, c); s.until = S.gt + 380; }
      else if (s.type === "sleepy") {
        s.taps++;
        if (s.taps === 1) { c.classList.remove("stir"); void c.offsetWidth; c.classList.add("stir"); float(c, "zz…", "soft"); s.until += 500; }
        else { s.done = true; c.querySelector("img").src = theoSprite("petted"); pet(PET.points.sleepy, c); s.until = S.gt + 420; }
      }
      else if (s.type === "belly") { s.done = true; c.querySelector("img").src = theoSprite("hiss"); S.score = Math.max(0, S.score + PET.points.belly); float(c, "hiss! −20", "bad"); ouch("Belly trap!! Every time…"); s.until = S.gt + 500; }
      else if (s.type === "treats") { s.done = true; S.treatUntil = S.real + PET.treatFor; S.lastTreat = S.gt; float(c, "treats! 🐟", "good"); banner("Treat time!"); buddy.say("joy", "Treats! Everything's slow-mo 🐟", { hold: false }); hide(i); }
      else if (PET.bad[s.type]) {
        s.done = true; S.hearts--; float(c, "−1 ♥", "bad"); ouch(PET.bad[s.type]);
        S.slots.forEach((t, k) => { if (t && ["theo", "sleepy"].includes(t.type) && !t.done) hide(k); });   // Theo runs off
        s.until = S.gt + 450;
        if (S.hearts <= 0) return end();
      }
      hud();
    }));
    const zoomEl = $("#pt-zoom");
    zoomEl.addEventListener("pointerdown", e => {
      e.preventDefault(); if (!S.zoom || S.zoom.caught || S.over) return;
      S.zoom.caught = true; zoomEl.src = theoSprite("petted"); S.score += PET.points.zoom; if (S.gt >= S.purrUntil) S.combo++; float(zoomEl, "+20 zoom!", "good");
      buddy.say("joy", "Caught him mid-zoomies!", { hold: false, burst: true }); hud();
    });

    const loop = now => {
      const dt = Math.min(64, now - last); last = now;
      S.real += dt; const slow = S.real < S.treatUntil ? .45 : 1; S.gt += dt * slow;
      const prog = Math.min(1, S.real / PET.round), purring = S.gt < S.purrUntil;
      S.slots.forEach((s, i) => { if (s && S.gt >= s.until) hide(i, true); });
      if (purring) { S.slots.forEach((s, i) => { if (!s && S.gt - (S.emptied[i] || 0) > 350) show(i, "theo", 1400); }); }
      else if (S.gt >= S.next) {
        const free = S.slots.map((s, i) => s ? -1 : i).filter(i => i >= 0);
        if (free.length) {
          const t = pick(), base = 1450 - 650 * prog;
          show(free[Math.random() * free.length | 0], t, t === "sleepy" ? base + 700 : t === "treats" ? 1100 : base);
          if (Math.random() < .25 + .35 * prog && free.length > 1) { const f2 = free.filter(x => !S.slots[x]); if (f2.length) { const t2 = pick(); show(f2[Math.random() * f2.length | 0], t2, base); } }
        }
        S.next = S.gt + (900 - 420 * prog) * (.7 + Math.random() * .6);
      }
      // zoomies: Theo dashes along the top of the cabinet
      if (!S.zoom && S.gt >= S.nextZoom && !purring) { S.zoom = { start: S.gt, dur: 1500 - 400 * prog, dir: Math.random() < .5 ? 1 : -1, caught: false }; zoomEl.src = theoSprite("zoom"); zoomEl.hidden = false; }
      if (S.zoom) {
        const k = (S.gt - S.zoom.start) / S.zoom.dur, w = $("#pt-top").clientWidth;
        if (k >= 1 || (S.zoom.caught && k > .15 && S.gt - S.zoom.start > 500)) { if (!S.zoom.caught) S.combo = 0; S.zoom = null; zoomEl.hidden = true; S.nextZoom = S.gt + 7000 + Math.random() * 5000; }
        else { const x = S.zoom.dir > 0 ? -80 + k * (w + 160) : w + 80 - k * (w + 160); zoomEl.style.transform = `translateX(${x}px) scaleX(${S.zoom.dir})`; }
      }
      hud();
      if (S.real >= PET.round) return end();
      petTheoRaf = requestAnimationFrame(loop);
    };
    function end() {
      if (S.over) return; S.over = true; stopPetTheo(); if (introText) introText.hidden = false;
      const sc = S.score, rating = sc >= 900 ? "Theo has chosen you as his human." : sc >= 450 ? "Theo approves." : "Theo tolerated you.";
      game.innerHTML = `<div class="pt"><div class="win">
        <img class="pt-sleep" src="${theoSprite("sleepy")}" alt="Theo, curled up asleep">
        <h3>${sc.toLocaleString("en-US")} points</h3>
        <p class="msg"><strong>${rating}</strong></p>
        <p class="msg">${S.hearts <= 0 ? "Too many troublemakers. Theo's gone to sulk in his cabinet." : "Theo has curled up for a nap."}</p>
        <div class="row-btns" style="justify-content:center"><button class="btn" id="pt-again" type="button">Pet him again</button></div>
        <p class="msg"><strong>Tomorrow's candle lights at midnight.</strong></p></div></div>`;
      $("#pt-again").onclick = play;
      buddy.say(sc >= 450 ? "joy" : "sad", sc >= 900 ? "Theo LOVES you!! 🧡" : sc >= 450 ? "Theo's happy! 🐾" : "Theo wants more pets…", { burst: sc >= 450 ? "big" : false });
    }
    hud(); buddy.say("idle", "Go go go! 🐾");
    const box = $("#pt-board").getBoundingClientRect(); if (box.bottom > innerHeight) scrollBy({ top: box.bottom - innerHeight + 16, behavior: "smooth" });
    petTheoRaf = requestAnimationFrame(loop);
  }
  intro();
}

/* ---------- confetti ---------- */
function confetti(ox = innerWidth / 2, oy = innerHeight / 3, n = 140) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#e2457a", "#5fbf95", "#f2c14e", "#b39cf5", "#ff9a5c"];
  const ps = Array.from({ length: n }, () => ({ x: ox, y: oy, vx: (Math.random() - .5) * 14, vy: Math.random() * -14 - 4, r: Math.random() * 6 + 4, c: cols[Math.random() * 5 | 0], a: Math.random() * 6 }));
  let f = 0;
  (function step() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (++f < 180) requestAnimationFrame(step); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- auto-switch at midnight ---------- */
let lastDay = realDay();
function dayChanged() { const d = realDay(); if (d !== lastDay) { lastDay = d; if (viewing == null) route(); } }
setInterval(dayChanged, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) dayChanged(); });
addEventListener("hashchange", () => { viewing = null; route(); });
