<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mutahar's 27th</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=IM+Fell+English+SC&family=Caveat:wght@600&family=Nunito:wght@500;700;800&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }

/* Layout: home = the hand-lettered title over ten candles (one blown per day); a game page = buddy beside the game. Single light look on purpose, matching the artwork. */
:root {
  --bg: #ffffff;
  --paper: #ffffff;
  --tint: #f7f3f5;
  --ink: #231c20;         /* the near-black of the title */
  --soft: #857a80;
  --accent: #e0606e;      /* candle red */
  --c-red: #e46a78; --c-purple: #c99ddb; --c-yellow: #f1e38a; --c-green: #b7d78f; --c-blue: #86c4d6;
  --hit: #78b65a;         /* right spot */
  --near: #efcf4f;        /* wrong spot */
  --miss: #d9d2d6;        /* not in word */
  --line: #ece5e9;
  --display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --display-sc: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --body: "Nunito", system-ui, sans-serif;
  --hand: "Caveat", "Segoe Print", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 20px; }
/* home: title + candles */
.home { display: grid; justify-items: center; gap: 10px; padding-block: 4vh 10px; text-align: center; }
.home .pre { font-family: var(--display); font-size: clamp(26px, 6vw, 40px); line-height: 1; margin: 0; }
.home h1 { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 12vw, 92px); line-height: 1; margin: 0 0 8px; letter-spacing: .01em; }
.cake-row { display: flex; justify-content: center; align-items: flex-end; gap: clamp(4px, 1.6vw, 14px); width: 100%; max-width: 560px; }
.candle { border: 0; background: none; padding: 0; font: inherit; color: var(--soft); display: grid; justify-items: center; gap: 6px; cursor: pointer; flex: 1 1 0; min-width: 0; -webkit-tap-highlight-color: transparent; }
.candle svg { width: 100%; max-width: 46px; height: auto; overflow: visible; display: block; }
.candle .flame { transform-origin: 17px 34px; transform-box: view-box; transition: transform .5s ease-in, opacity .5s ease-in; }
.candle .flame { animation: sway 2.6s ease-in-out infinite alternate; }
.candle:nth-child(odd) .flame { animation-duration: 3.1s; animation-delay: -.8s; }
.candle .glow { opacity: 0; transition: opacity .3s; }
.candle .smoke { opacity: 0; }
.candle .day { font-size: 11px; font-weight: 800; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.candle.ready .glow { opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
.candle.ready .flame { animation: flick .35s ease-in-out infinite alternate; }
.candle.ready .day { color: var(--accent); }
.candle.blown .flame { opacity: 0; transform: scale(.2, 0); animation: none; }
.candle.blown .day { color: var(--ink); }
.candle.blowing .flame { animation: blowout .7s ease-in forwards; }
.candle.blowing .smoke { animation: smoke 1.4s ease-out .45s forwards; }
.candle.locked { cursor: default; }
.candle:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
.candle.nope svg { animation: nope .4s; }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes flick { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(1.08, 1.14) rotate(3deg); } }
@keyframes pulse { 0%,100% { transform: scale(.85); opacity: .55; } 50% { transform: scale(1.15); opacity: 1; } }
@keyframes blowout { 0% { transform: rotate(0); } 30% { transform: rotate(-28deg) scale(1.1, .9); } 60% { transform: rotate(-40deg) scale(.6, .4); opacity: .8; } 100% { transform: rotate(-50deg) scale(0); opacity: 0; } }
@keyframes smoke { 0% { opacity: .9; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-34px); } }
@keyframes nope { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.hint { min-height: 3.2em; display: grid; gap: 2px; justify-items: center; margin-top: 10px; }
.hint .line { font-family: var(--display); font-size: clamp(20px, 4.4vw, 26px); }
.hint .clockline { color: var(--soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.hint .nudge { color: var(--accent); }

/* game page header */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { font: 800 14px var(--body); color: var(--ink); background: none; border: 0; cursor: pointer; padding: 6px 0; }
.back:hover { color: var(--accent); }
.topbar .mark { font-family: var(--display); font-size: 18px; color: var(--soft); }

.card { background: var(--paper); border-radius: 22px; padding: 22px max(16px, 3vw); border: 1.5px solid var(--line); box-shadow: 0 14px 34px -26px rgba(35,28,32,.35); display: grid; gap: 16px; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0; text-align: center; }
.card p { margin: 0; text-align: center; color: var(--soft); max-width: 52ch; justify-self: center; }
.preview-note { font-size: 13px; text-align: center; color: var(--soft); background: #fff; border: 1px dashed var(--accent); border-radius: 999px; padding: 6px 14px; justify-self: center; display: flex; flex-wrap: wrap; gap: 6px 10px; justify-content: center; align-items: center; }
.preview-note button, .preview-note a { font: 700 12px var(--body); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

.clock { font-family: var(--display); font-size: clamp(40px, 12vw, 72px); text-align: center; font-variant-numeric: tabular-nums; color: var(--accent); }

/* stage: buddy beside the game */
.stage { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: start; }
.game { display: grid; gap: 16px; min-width: 0; }

/* buddy */
#buddy-slot { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 5; align-self: start; }
.buddy { display: grid; justify-items: center; gap: 10px; padding: 14px 10px; border-radius: 18px; background: #fff; border: 2px solid var(--line); z-index: 5; }
.spritebox { position: relative; width: 130px; height: 240px; display: grid; place-items: end center; }
.sprite { width: 130px; height: 240px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; transition: filter .3s; }
.bubble { position: relative; background: var(--tint); border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 14px; text-align: center; color: var(--ink); min-height: 2.6em; display: grid; place-items: center; width: 100%; }
.bubble::before { content: ""; position: absolute; top: -8px; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--tint); }
.spritebox.bop { animation: bop .24s ease-out; }
@keyframes bop { 40% { transform: translateY(-7px) scale(1.03, .97); } }
.bname { font-family: var(--display); font-size: 18px; color: var(--accent); line-height: 1; }
.edit-buddy { font: 700 12px var(--body); color: var(--soft); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }

.fx > * { position: absolute; opacity: 0; transition: opacity .25s; pointer-events: none; }
.cloud { top: -22px; left: 50%; transform: translateX(-50%); width: 96px; height: 40px; image-rendering: pixelated; }
.rain { top: 14px; left: 50%; transform: translateX(-50%); width: 80px; height: 40px; }
.rain i { position: absolute; top: 0; width: 3px; height: 8px; background: #7fa7e8; border-radius: 2px; animation: drop .9s linear infinite; }
.think { top: 2px; right: -14px; display: flex; gap: 4px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 8px; }
.think::after { content: ""; position: absolute; bottom: -12px; left: 8px; width: 8px; height: 8px; border: 3px solid var(--ink); border-radius: 50%; background: #fff; }
.think i { width: 6px; height: 6px; background: var(--ink); border-radius: 50%; animation: dots 1s infinite; }
.think i:nth-child(2) { animation-delay: .15s; } .think i:nth-child(3) { animation-delay: .3s; }
.sparks { inset: 0; }
.sparks b { position: absolute; color: var(--near); font-size: 18px; animation: twinkle .8s ease-in-out infinite alternate; }

.buddy[data-mood="sad"] .cloud, .buddy[data-mood="sad"] .rain { opacity: 1; }
.buddy[data-mood="sad"] .sprite { filter: saturate(.55) brightness(.95); transform: translateY(3px); }
.buddy[data-mood="think"] .think { opacity: 1; }
.buddy[data-mood="joy"] .sparks { opacity: 1; }
.buddy[data-mood="joy"] .sprite { animation: jump .45s ease-in-out 4; }
@keyframes drop { from { transform: translateY(0); opacity: 1; } to { transform: translateY(34px); opacity: 0; } }
@keyframes dots { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes jump { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-22px); } }
@keyframes twinkle { from { transform: scale(.7) rotate(-10deg); } to { transform: scale(1.2) rotate(10deg); } }

/* buddy maker */
.maker { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: start; }
.maker .preview { display: grid; justify-items: center; gap: 10px; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 16px; }
.maker .preview canvas { width: 156px; height: 288px; image-rendering: pixelated; }
.opts { display: grid; gap: 14px; min-width: 0; }
.opt { display: grid; gap: 6px; }
.opt > label, .opt > span { font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.chip { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font: 700 14px var(--body); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: #ffe3ec; }
.text-in { font: 700 16px var(--body); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; width: 100%; max-width: 260px; background: #fff; }
.text-in:focus, .swatch:focus-visible, .chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }

/* quordle */
.boards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 460px; justify-self: center; }
.board { display: grid; gap: 3px; padding: 6px; border-radius: 12px; border: 2px solid var(--line); background: #fff; }
.board.solved { border-color: var(--hit); }
.tally { display: grid; grid-template-columns: repeat(4, 34px); gap: 6px; justify-content: center; }
.tally span { height: 30px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--soft); }
.tally span.ok { background: var(--hit); border-color: var(--hit); color: #fff; }
.tally span.lost { border-color: var(--accent); color: var(--accent); }
.board.lost { border-color: #f1b8bf; }
.answer-row { margin-top: 4px; }
.tile.answer { background: #fde6e8; border-color: var(--accent); color: var(--accent); }

.row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.tile { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 6px; border: 2px solid var(--line);
  font-weight: 800; font-size: clamp(13px, 3.2vw, 19px); text-transform: uppercase; background: #fff; color: var(--ink); }
.tile.typing { border-color: var(--soft); }
.tile.hit { background: var(--hit); border-color: var(--hit); color: #fff; }
.tile.near { background: var(--near); border-color: var(--near); color: var(--ink); }
.tile.miss { background: var(--miss); border-color: var(--miss); color: var(--ink); }
.tile.flip { animation: flip .45s ease both; }
.row.shake { animation: shake .35s; }
@keyframes flip { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
@keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

.status { text-align: center; font-weight: 700; color: var(--soft); min-height: 1.4em; }
.keyboard { display: grid; gap: 6px; user-select: none; }
.krow { display: flex; justify-content: center; gap: 4px; }
.key { flex: 1 1 0; max-width: 46px; height: 50px; border: 0; border-radius: 8px; font: 800 15px var(--body); color: var(--ink);
  text-transform: uppercase; cursor: pointer; position: relative; overflow: hidden; background: #f1ecef; padding: 0; }
.key.wide { max-width: 72px; flex-grow: 1.6; font-size: 12px; }
.key .q { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.key .q i.hit { background: var(--hit); } .key .q i.near { background: var(--near); } .key .q i.miss { background: var(--miss); }
.key span { position: relative; }
.key:focus-visible { outline: 3px solid var(--accent); }
.key:active { transform: translateY(1px); }

.win { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 18px; border-radius: 18px; background: #fff; border: 2px dashed var(--accent); }
.win h3 { font-family: var(--display); font-weight: 400; font-size: 32px; margin: 0; color: var(--accent); }
.win .msg { color: var(--ink); max-width: 46ch; }
.reveal { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.reveal b { background: var(--hit); color: #fff; border-radius: 8px; padding: 4px 10px; letter-spacing: .1em; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font: 800 14px var(--body); background: var(--accent); color: #fff; cursor: pointer; }
.btn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }
/* final cut */
.fc { display: grid; gap: 16px; justify-items: center; text-align: center; }
.fc-meta { display: flex; justify-content: space-between; width: 100%; max-width: 460px; color: var(--soft); font-weight: 700; }
.fc-clock { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 800; }
.fc-dots { display: flex; gap: 6px; }
.fc-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.fc-dots i.ok { background: var(--hit); } .fc-dots i.skip { background: var(--accent); } .fc-dots i.now { background: var(--ink); }
.fc-cut { font-family: var(--display); font-size: clamp(34px, 8vw, 60px); letter-spacing: .12em; line-height: 1.1; word-break: break-all; max-width: 100%; padding: 18px 10px; }
.fc-cut.shake { animation: shake .35s; }
.fc-form { display: grid; gap: 10px; justify-items: center; width: 100%; }
.fc-in { max-width: 420px; text-align: center; font-size: 18px; }
.fc-example { display: grid; gap: 2px; justify-items: center; padding: 10px 0; }
.fc-example .fc-cut { font-size: clamp(28px, 6vw, 44px); padding: 0; }
.fc-arrow { color: var(--soft); } .fc-title { font-family: var(--display); font-size: 24px; color: var(--soft); }
.fc-small { font-size: 14px; }
.fc-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; width: 100%; max-width: 440px; text-align: left; }
.fc-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 10px; background: var(--tint); }
.fc-list li.ok span:first-child { color: var(--hit); font-weight: 800; } .fc-list li.skip span:first-child { color: var(--accent); font-weight: 800; }
.fc-sk { font-family: var(--display); letter-spacing: .08em; color: var(--soft); overflow-wrap: anywhere; }
/* name that tune */
.nt { display: grid; gap: 14px; width: 100%; max-width: 560px; justify-self: center; }
.nt-top { display: flex; justify-content: space-between; align-items: baseline; color: var(--soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.nt-score b { color: var(--ink); font-size: 18px; }
.nt-worth { text-align: center; display: grid; gap: 2px; }
.nt-lbl { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
.nt-big { font-size: clamp(40px, 9vw, 56px); font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.nt-wave { position: relative; height: 84px; display: flex; align-items: center; gap: 2px; padding: 0 2px; border-left: 2px solid var(--line); }
.nt-wave i { flex: 1 1 0; min-width: 0; background: var(--line); border-radius: 1px; transition: background .15s; }
.nt-wave i.on { background: #b9b0b5; }
.nt-wave i.now { background: var(--hit); }
.nt-head { position: absolute; top: -6px; bottom: -6px; left: 0; width: 2px; background: var(--ink); border-radius: 2px; }
.nt-head::before { content: ""; position: absolute; top: -4px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.nt-times { display: flex; justify-content: space-between; color: var(--soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.nt-times b { color: var(--ink); }
.nt-chips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.nt-chip { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 14px; font: 800 15px var(--body); color: var(--soft); cursor: pointer; font-variant-numeric: tabular-nums; }
.nt-chip[aria-pressed="true"] { background: var(--tint); color: var(--ink); border-color: var(--ink); }
.nt-chip:disabled { opacity: .35; cursor: default; }
.nt-row { display: flex; gap: 10px; }
.nt-play { flex: 1 1 auto; border: 0; border-radius: 14px; padding: 18px; font: 800 17px var(--body); background: var(--hit); color: #fff; cursor: pointer; }
.nt-play.playing { background: #5f9b45; }
.nt-side { flex: 0 0 auto; min-width: 64px; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 0 16px; font: 800 16px var(--body); color: var(--ink); cursor: pointer; }
.nt-side:disabled { opacity: .35; cursor: default; }
.nt-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; }
.nt-form .text-in { max-width: none; }
.nt-form.shake { animation: shake .35s; }
.nt-reveal { text-align: center; display: grid; gap: 2px; padding: 14px; border-radius: 16px; background: var(--tint); }
.nt-rt { font-family: var(--display); font-size: 28px; } .nt-ra { color: var(--soft); font-weight: 700; } .nt-rnote { margin-top: 6px; }
.nt-chip:focus-visible, .nt-play:focus-visible, .nt-side:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.nt-list li { grid-template-columns: 22px minmax(0, 1fr) auto; }
.nt-li { display: grid; color: var(--ink); } .nt-li b { font-weight: 700; } .nt-li small { color: var(--soft); font-size: 13px; }
@media (max-width: 520px) { .nt-form { grid-template-columns: minmax(0, 1fr); } }
/* pet theo */
.pt { display: grid; gap: 12px; width: 100%; max-width: 480px; justify-self: center; }
.pt-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 8px; }
.pt-leg { display: grid; justify-items: center; text-align: center; gap: 2px; font-size: 12px; color: var(--soft); }
.pt-leg img { width: 56px; height: auto; image-rendering: pixelated; }
.pt-leg b { color: var(--ink); font-size: 13px; }
.pt-small { font-size: 14px; }
.pt-hud { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.pt-hearts { color: var(--accent); font-size: 22px; letter-spacing: 2px; }
.pt-score { font-size: 28px; } .pt-time { color: var(--soft); font-size: 20px; min-width: 2ch; text-align: right; }
.pt-right { display: flex; align-items: center; gap: 10px; }
.pt-snd-mini { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; padding: 0; }
.pt-time::after { content: "s"; font-size: 14px; }
.pt-meter { position: relative; height: 18px; border-radius: 999px; background: var(--tint); overflow: hidden; border: 1.5px solid var(--line); }
.pt-meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #f2c58f, #e89a9a); transition: width .2s; }
.pt-meter span { position: relative; display: block; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; line-height: 15px; color: var(--ink); }
.pt-board { position: relative; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.pt-top { position: relative; height: 60px; overflow: hidden; border-bottom: 10px solid #7a4e2d; border-radius: 6px 6px 0 0; }
.pt-zoom { position: absolute; bottom: -6px; left: 0; width: 76px; image-rendering: pixelated; cursor: pointer; }
.pt-cab { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; background: #9a6638; border-radius: 0 0 14px 14px;
  box-shadow: inset 0 0 0 4px #7a4e2d, 0 12px 24px -16px rgba(60,30,10,.6); perspective: 600px; }
.pt-cubby { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 6px; overflow: hidden; cursor: pointer;

function paintGrid(canvas, grid, scale = 8) {
  const w = grid[0].length, h = grid.length;
  canvas.width = w * scale; canvas.height = h * scale;
  const x = canvas.getContext("2d"); x.clearRect(0, 0, canvas.width, canvas.height);
  grid.forEach((row, j) => row.forEach((col, i) => { if (col) { x.fillStyle = col; x.fillRect(i * scale, j * scale, scale, scale); } }));
}

function realDay(now = new Date()) {
  const start = new Date(CONFIG.year, CONFIG.month - 1, 1);   // Nov 1, local midnight
  if (now < start) return 0;                                  // before: nothing to blow yet
  const n = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - start) / 864e5) + 1;
  return Math.min(n, 10);                                     // 10 and after: the cake
}

  const m = location.hash.match(/^#day-(\d+)$/);

  if (viewing === 3) return renderDay3(view, PV());
  if (viewing === 4) return renderDay4(view, PV());
  if (viewing === 5) return renderDay6(view, PV());   // pet theo moved to day 5
  if (viewing === 6) return renderDay7(view, PV());   // sliding puzzle moved to day 6
  if (viewing === 7) return renderBakers(view, PV());
  if (viewing === 8) return renderDay8(view, PV());
  return renderPlaceholder(view, viewing, PV());
}

let clockTimer = null;

const DATE = d => `Nov ${d}`;

function renderHome(view) {

  const ready = d => d <= today && !done.has(d);

  if (pv) $("#pv-reset").onclick = () => { store.del(BLOWN_KEY()); route(); };

  }

    if (pv) return "";
    const now = new Date(), next = today === 0 ? new Date(CONFIG.year, CONFIG.month - 1, 1) : new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    let s = Math.max(0, Math.floor((next - now) / 1000)); const dd = Math.floor(s / 86400); s %= 86400;
    return (dd ? dd + "d " : "") + `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`;
  };
  const waiting = [...Array(10)].map((_, i) => i + 1).filter(ready);
  const msg = () => {

/* ---------- Day 1: Quordle ---------- */
function score(guess, answer) {
  const res = Array(5).fill("miss"), left = {};
  for (let i = 0; i < 5; i++) guess[i] === answer[i] ? res[i] = "hit" : left[answer[i]] = (left[answer[i]] || 0) + 1;
  for (let i = 0; i < 5; i++) if (res[i] !== "hit" && left[guess[i]]) { res[i] = "near"; left[guess[i]]--; }
  return res;
}
const chunk5 = s => s.match(/.{5}/g);
let WORDS = null;
function words() {
  if (!WORDS) { const a = chunk5(ANSWERS_RAW); WORDS = { answers: a, valid: new Set([...a, ...chunk5(GUESSES_RAW)]) }; }
  return WORDS;
}
function freshAnswers() {
  const a = words().answers, pick = new Set();
  while (pick.size < 4) pick.add(a[Math.random() * a.length | 0].toUpperCase());
  return [...pick];
}

let quordleGame = null;
function renderDay1(view, pv) {
  // four random words, new every time the page is opened (kept while he moves around the site, never saved)
  const MAX = 9;
  if (!quordleGame) quordleGame = { answers: freshAnswers(), guesses: [] };
  const st = quordleGame;
  const W = st.answers;
  let cur = "", lastFlip = -1;

  const game = stage(view, pv, "Day 1 · Quordle", "Guess all four words in 9 tries. Every guess goes into all four boards.",
    ` · <a href="#" id="reset">new words</a>`);
  game.innerHTML = `<div style="display:grid;gap:14px">
    ${store.get(DAY1_DONE()) ? `<button class="gift-link" id="gift-link" type="button">${giftState().pick ? "🎁 See your gift" : "🎁 Pick your gift"}</button>` : ""}
    <div class="tally" id="tally" aria-label="Boards solved"></div>
    <div class="boards" id="boards"></div>
    <div class="status" id="status" aria-live="polite"></div><div id="end"></div><div class="keyboard" id="kb"></div></div>`;
  if (pv) $("#reset").onclick = e => { e.preventDefault(); quordleGame = null; route(); };
  if ($("#gift-link")) $("#gift-link").onclick = () => renderGift(view, pv);

  const solvedAt = () => W.map(w => st.guesses.indexOf(w));
  const won = () => solvedAt().every(i => i >= 0);
  const over = () => won() || st.guesses.length >= MAX;

  function draw() {
    const sa = solvedAt(), boards = $("#boards"), done = over();
    $("#tally").innerHTML = W.map((w, b) => `<span class="${sa[b] >= 0 ? "ok" : done ? "lost" : ""}">${sa[b] >= 0 ? sa[b] + 1 : done ? "✕" : ""}</span>`).join("");
    boards.innerHTML = "";
    W.forEach((w, b) => {
      const el = document.createElement("div");
      el.className = "board" + (sa[b] >= 0 ? " solved" : done ? " lost" : "");
      el.setAttribute("aria-label", `Board ${b + 1}`);
      for (let r = 0; r < MAX; r++) {
        const row = document.createElement("div"); row.className = "row";
        const g = st.guesses[r];
        const showGuess = g && (sa[b] < 0 || r <= sa[b]);
        const typing = !done && sa[b] < 0 && r === st.guesses.length;
        const marks = showGuess ? score(g, w) : null;
        for (let i = 0; i < 5; i++) {
          const t = document.createElement("div"); t.className = "tile";
          if (showGuess) { t.textContent = g[i]; t.classList.add(marks[i]); if (r === lastFlip) { t.classList.add("flip"); t.style.animationDelay = i * 80 + "ms"; } }
          else if (typing && cur[i]) { t.textContent = cur[i]; t.classList.add("typing"); }
          row.appendChild(t);
        }
        if (typing) row.dataset.typing = "";
        el.appendChild(row);
      }
      if (done && sa[b] < 0) {                                   // lost: the answer goes under the board's guesses
        const row = document.createElement("div"); row.className = "row answer-row";
        row.innerHTML = [...w].map(ch => `<div class="tile answer">${ch}</div>`).join("");
        el.appendChild(row);
      }
      boards.appendChild(el);
    });
    drawKeys();
    const left = MAX - st.guesses.length;
    if (!done) $("#status").textContent = `${left} guess${left === 1 ? "" : "es"} left`;
    if (done) finish();
  }

  function drawKeys() {
    const sa = solvedAt(), rank = { hit: 3, near: 2, miss: 1 };
    const kb = $("#kb"); kb.innerHTML = "";
    ["QWERTYUIOP", "ASDFGHJKL", "+ZXCVBNM-"].forEach(line => {
      const row = document.createElement("div"); row.className = "krow";
      [...line].forEach(ch => {
        const k = document.createElement("button"); k.className = "key"; k.type = "button";
        if (ch === "+") { k.classList.add("wide"); k.innerHTML = "<span>Enter</span>"; k.onclick = submit; }
        else if (ch === "-") { k.classList.add("wide"); k.innerHTML = "<span>⌫</span>"; k.onclick = back; k.setAttribute("aria-label", "Delete"); }
        else {
          const quads = W.map((w, b) => {
            if (sa[b] >= 0) return "";
            let best = "";
            st.guesses.forEach(g => score(g, w).forEach((m, i) => { if (g[i] === ch && (!best || rank[m] > rank[best])) best = m; }));
            return best;
          });
          k.innerHTML = `<span class="q">${quads.map(q => `<i class="${q}"></i>`).join("")}</span><span>${ch}</span>`;
          k.onclick = () => type(ch);
        }
        row.appendChild(k);
      });
      kb.appendChild(row);
    });
  }

  function shake(msg) {
    $("#status").textContent = msg;
    document.querySelectorAll("[data-typing]").forEach(r => { r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake"); });
  }
  const typingLines = ["Ooh, good start…", "Hmm hmm…", "Keep typing…", "I like it…", "Ooh!"];
  function type(ch) { if (over() || cur.length >= 5) return; cur += ch; lastFlip = -1; draw(); buddy.bop(cur.length === 5 ? "Press enter!" : typingLines[cur.length - 1]); }
  function back() { if (over()) return; cur = cur.slice(0, -1); lastFlip = -1; draw(); buddy.bop("Changed your mind?"); }
  function submit() {
    if (over()) return;
    if (cur.length < 5) { buddy.say("think", "Five letters, please!", { hold: false, ms: 1600 }); return shake("Not enough letters"); }
    if (!words().valid.has(cur.toLowerCase())) { shake("Not in word list"); buddy.say("think", "Hmm… is that a word?", { hold: false }); return; }
    const before = solvedAt().filter(i => i >= 0).length;
    const guess = cur;
    st.guesses.push(guess); lastFlip = st.guesses.length - 1; cur = "";
    draw();
    react(guess, before);
  }

  // buddy reactions to each guess
  function react(guess, before) {
    const sa = solvedAt(), after = sa.filter(i => i >= 0).length, left = MAX - st.guesses.length;
    if (won() || over()) return;                                 // finish() handles the ending
    if (after > before) return buddy.say("joy", after - before > 1 ? "TWO at once?! Amazing!" : `Got one! ${4 - after} to go!`, { hold: false, burst: true });
    let best = 0, anyHit = 0, anyNear = 0;
    W.forEach((w, b) => { if (sa[b] >= 0) return; const m = score(guess, w); const h = m.filter(x => x === "hit").length, n = m.filter(x => x === "near").length;
      best = Math.max(best, h + n * .5); anyHit += h; anyNear += n; });
    if (best >= 3.5) return buddy.say("think", left === 1 ? "Last guess… so, so close!" : "Ooh… so close. Thinking…");
    if (anyHit === 0 && anyNear <= 1) return buddy.say("sad", "Oh no… nothing there.");
    buddy.say("idle", left <= 2 ? `${left} left… we can do this!` : "Some clues! Keep going.", { hold: false });
  }

  function finish() {
    const w = won(), n = solvedAt().filter(i => i >= 0).length;
    $("#kb").hidden = true; $("#status").textContent = "";
    $("#end").innerHTML = `<div class="win">
      <h3>${w ? "You got all four!" : `${n} of 4`}</h3>
      <p class="msg">${w ? `Solved in ${st.guesses.length} guesses.` : n ? "So close! The missing words are under their boards." : "Not this time. The words are under each board."}</p>
      <div class="row-btns" style="justify-content:center"><button class="btn" id="to-gift" type="button">${giftState().pick ? "See your gift 🎁" : "Pick your gift →"}</button><button class="btn ghost" id="again" type="button">Play again</button></div>
    </div>`;
    store.set(DAY1_DONE(), true);
    $("#again").onclick = () => { quordleGame = null; route(); };
    $("#to-gift").onclick = () => { renderGift(view, pv); scrollTo(0, 0); };
    if (w) buddy.say("joy", "WE DID IT!! 🎉", { burst: lastFlip >= 0 ? "big" : false });
    else buddy.say("sad", n ? `${n} out of 4… next time!` : "Aww… next time!");
  }

  document.onkeydown = e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input")) return;
    if (e.key === "Enter") { e.preventDefault(); submit(); }
    else if (e.key === "Backspace") back();
    else if (/^[a-z]$/i.test(e.key)) type(e.key.toUpperCase());
  };
  if (!over()) buddy.say("idle", st.guesses.length ? "Welcome back! Let's finish this." : "Let's find those words!");
  draw();
}

/* ---------- reading the text files in content/ (museum, compliments, puzzles) ---------- */
async function readLines(path) {
  try {
    const r = await fetch(path + "?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return null;
    return (await r.text()).split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith("#"));
  } catch (e) { return null; }
}
const splitBar = l => l.split("|").map(x => x.trim());
const inFolder = (folder, name) => encodeURI(name.includes("/") ? name : folder + "/" + name).replace(/'/g, "%27");
let museumReady = false, puzzlesReady = false, COMPLIMENTS = ["You make every day better."];
const EMOTES = ["💕", "🥹", "😂", "✨", "🫶", "😍", "🌸", "☺️"];
async function prepareMuseum() {
  const [pics, words] = await Promise.all([readLines("content/museum.txt"), readLines("content/compliments.txt")]);
  if (pics && pics.length) MUSEUM.splice(0, MUSEUM.length, ...pics.map((l, i) => { const [name, emote] = splitBar(l); return { img: inFolder("museum", name), emote: emote || EMOTES[i % EMOTES.length] }; }));
  if (words && words.length) COMPLIMENTS = words.slice(0, 20);
  museumReady = true;
}
function photoRatio(src) {                                   // width ÷ height, so the board can take the photo's shape
  return new Promise(res => { const im = new Image(); im.onload = () => res(im.naturalWidth / im.naturalHeight || 1); im.onerror = () => res(1); im.src = src; });
}
function squareCrop(src) {                                  // the middle square of any photo, so puzzle tiles never stretch
  return new Promise(res => {
    const im = new Image(); im.onload = () => {
      const s = Math.min(im.naturalWidth, im.naturalHeight), out = Math.min(s, 900), c = document.createElement("canvas"); c.width = c.height = out;
      c.getContext("2d").drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, out, out);
      try { res(c.toDataURL("image/jpeg", .9)); } catch (e) { res(src); }
    };
    im.onerror = () => res(src); im.src = src;
  });
}
async function preparePuzzles() {
  const lines = await readLines("content/puzzles.txt");
  if (lines && lines.length) PUZZLES.splice(0, PUZZLES.length, ...lines.map(l => { const [name, ...cap] = splitBar(l); return { img: inFolder("puzzles", name), size: 3, caption: cap.join(" | ") }; }));
  for (const pz of PUZZLES) pz.ratio = await photoRatio(pz.img);
  puzzlesReady = true;
}

/* ---------- a daisy, drawn the same way as everything else ---------- */
function daisyGrid() {
  const W = 15, H = 21, g = Array.from({ length: H }, () => Array(W).fill(null));
  const ell = (cx, cy, rx, ry, col) => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1) g[y][x] = col; };
  for (let y = 11; y < H; y++) g[y][7] = "#5f9a46";                                            // stem
  ell(10.4, 15.2, 2.6, 1.2, "#6fae52"); ell(4.6, 17.6, 2.4, 1.1, "#6fae52");                // leaves
  for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; ell(7.5 + Math.cos(a) * 4.3, 6.5 + Math.sin(a) * 4.3, 2.3, 2.3, k > 0 && k < 4 ? "#ece8f0" : "#ffffff"); }
  ell(7.5, 6.5, 2.7, 2.7, "#f5c842"); ell(8.2, 7.2, 1.3, 1.3, "#e3a72b");                    // centre
  const o = g.map(r => r.slice());

      wave?.querySelectorAll("i").forEach(b => b.classList.toggle("now", +b.dataset.t <= t));
      if (t >= len || a.paused || a.ended) { a.pause(); btn?.classList.remove("playing"); wave?.querySelectorAll("i.now").forEach(b => b.classList.remove("now")); return; }
      tuneRaf = requestAnimationFrame(tick);

  }

    stopTune();
    st.score += pts; st.results[st.i] = { pts, note, ok, song: SONGS[st.order[st.i]] };

  }

  function finish() {
    stopTune();

      <p class="msg"><strong>Tomorrow's candle lights at midnight.</strong></p></div></div>`;
    $("#nt-again").onclick = () => { tuneGame = null; route(); };
    const good = st.score >= SONGS.length * 10000 * .5;

  }
  if (st.i < st.order.length && st.phase === "guess" && st.i === 0 && !st.results.length) buddy.say("idle", "Ears ready? 🎧");
  draw();
}

/* ---------- Theo's cameos when the purr meter fills: a high-five, then a kiss, alternating ---------- */
function pawGrid() {                                   // lying sideways: four toes on the left, the arm running off the right edge
  const W = 44, H = 26, C = "#f3d7ae", c = "#e2bb8a", P = "#f4a3a8", p = "#e2858c", O = "#5a3d2e", L = "#fdf3e4";

  for (let y = 7; y < 20; y++) for (let x = 17; x < W; x++) g[y][x] = y > 16 ? c : C;      // arm, all the way to the edge
  [[24, 7], [31, 7], [38, 7], [27, 19], [35, 19]].forEach(([x, y]) => { g[y][x] = null; });    // a few fluffy notches
  ell(13, 13, 8, 9.4, C);                                                                    // palm
  [[5.5, 4.6], [3.2, 10.2], [3.2, 15.8], [5.5, 21.4]].forEach(([x, y]) => ell(x, y, 3.4, 3.2, C)); // toes

  ell(13, 13, 8, 9.4, C); [[5.5, 4.6], [3.2, 10.2], [3.2, 15.8], [5.5, 21.4]].forEach(([x, y]) => ell(x, y, 3.4, 3.2, C));

  [[6.2, 5.2], [4, 10.4], [4, 15.6], [6.2, 20.8]].forEach(([x, y]) => ell(x, y, 1.6, 1.5, P)); // toe beans

}

let slideGame = null, slideTimer = null;

const fmtClock = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function slideOptimal(board, n, cap = 40) {   // fewest moves to solve (A*), or Infinity past the cap
  const blank = n * n - 1, goal = board.map((_, k) => k).join(",");

    const [f, g, b] = open.splice(bi, 1)[0];

    const z = b.indexOf(blank), x = z % n, y = z / n | 0;

      const nb = b.slice(), p = c * n + a; [nb[z], nb[p]] = [nb[p], nb[z]];

      seen.set(key, g + 1); open.push([g + 1 + h(nb), g + 1, nb]);

}
function fairBoard(n) {

    const p = opts[Math.random() * opts.length | 0];
    [t[b], t[p]] = [t[p], t[b]]; prev = b; b = p;

}

function renderDay7(view, pv) {

/* part 1 · the kitchen: two bakers, two lanes, each with a gate only their superpower gets through */
const KT = 24, KW = 24, KH = 17;                 // tile size, grid width/height (in tiles)
const LANES = [{ floor: 7 }, { floor: 15 }];      // each lane: six rows of air above its floor row
const PHYS = { g: 1500, run: 118, jump: 410, w: 16, h: 40 };
const BASES = [["flour", "Flour"], ["cocoa", "Cocoa"], ["eggs", "Eggs"], ["sugar", "Sugar"], ["butter", "Butter"]];
const BAKE_KEY = () => PV() ? "bday-bake-preview" : "bday-bake";
const CAKE_KEY = "bday-cake";

function ingredientGrid(key) {
  if (!BASES.some(([k]) => k === key)) return toppingGrid(key);
  const W = 16, H = 16, g = Array.from({ length: H }, () => Array(W).fill(null));
  const ell = (cx, cy, rx, ry, col) => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1) g[y][x] = col; };

  if (key === "flour") { ell(8, 10, 5.5, 5.5, "#f3ece0"); rect(4, 4, 11, 9, "#f3ece0"); rect(6, 2, 9, 3, "#e3d6c1"); rect(4, 8, 11, 9, "#7aa6d8"); g[11][7] = g[11][8] = "#d7c9b2"; }
  if (key === "cocoa") { rect(4, 3, 11, 14, "#6b3a22"); rect(4, 2, 11, 3, "#c9a26b"); rect(4, 7, 11, 10, "#f2d9a8"); rect(6, 8, 9, 9, "#6b3a22"); }
  if (key === "eggs") { ell(5.5, 9.5, 3.4, 4.4, "#fbf3e6"); ell(10.5, 9, 3.4, 4.4, "#f4e2c8"); g[7][4] = g[6][9] = "#ffffff"; }
  if (key === "sugar") { rect(3, 8, 7, 12, "#ffffff"); rect(8, 8, 12, 12, "#f6f1ea"); rect(5, 3, 10, 7, "#fbf8f3"); g[9][4] = g[4][6] = "#e9e2d8"; }
  if (key === "butter") { rect(2, 6, 13, 12, "#f6d77a"); rect(2, 6, 7, 12, "#f9e7a8"); rect(2, 5, 13, 5, "#e9c35a"); }
  const o = g.map(r => r.slice());
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!g[y][x] && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => g[y + dy]?.[x + dx])) o[y][x] = "#3a2a26";
  return o;
}
const itemCanvas = {};
function itemSprite(key) { if (!itemCanvas[key]) { const c = document.createElement("canvas"); paintGrid(c, key === "theo" ? spriteGrid("petted") : ingredientGrid(key), 1); itemCanvas[key] = c; } return itemCanvas[key]; }
const itemName = k => (BASES.find(b => b[0] === k) || TOPPINGS.find(t => t[0] === k) || [k, k])[1];

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const rnd = n => Math.random() * n | 0;

/* a level: two lanes, each with one power gate, one item, one door; theo patrols one lane */
function makeLevel(items, powers) {
  const grid = Array.from({ length: KH }, (_, y) => Array.from({ length: KW }, (_, x) => (y === 0 || x === 0 || x === KW - 1 || y === 7 || y === 8 || y >= 15) ? "#" : "."));
  const order = Math.random() < .5 ? ["m", "f"] : ["f", "m"];
  const lanes = [], crates = [], theoLane = rnd(2);
  order.forEach((who, li) => {
    const fl = LANES[li].floor, power = powers[who], gx = 4 + rnd(3);
    const set = (x, y, c) => { grid[y][x] = c; };
    let gateEnd = gx;
    if (power === "fire") { for (let x = gx; x < gx + 5; x++) set(x, fl, "F"); for (let y = fl - 3; y < fl; y++) set(gx + 6, y, "X"); gateEnd = gx + 6; }
    if (power === "splash") { for (let x = gx; x < gx + 5; x++) set(x, fl, "M"); set(gx + 6, fl - 1, "f"); gateEnd = gx + 6; }
    if (power === "bubble") { for (let y = fl - 3; y < fl; y++) { set(gx + 1, y, "#"); set(gx + 2, y, "#"); } gateEnd = gx + 2; }
    if (power === "strong") { crates.push({ x: gx * KT, y: (fl - 1) * KT, w: KT, h: KT, vy: 0 }); for (let y = fl - 3; y < fl; y++) { set(gx + 5, y, "#"); set(gx + 6, y, "#"); } gateEnd = gx + 6; }

    const ix = Math.min(19, gateEnd + 2 + rnd(Math.max(1, 19 - gateEnd - 1)));
    let iy = fl - 1;
    if (Math.random() < .5) { set(ix, fl - 1, "#"); iy = fl - 2; }                       // sometimes the item sits on a step
    lanes.push({ who, floor: fl, item: { key: items[li], x: ix * KT + 4, y: iy * KT + 2, got: false }, door: { x: 21 * KT, y: (fl - 2) * KT }, start: { x: KT + 4, y: fl * KT - PHYS.h },
      theo: li === theoLane ? { x: (gateEnd + 1) * KT + 2, y: fl * KT - 20, dir: 1, min: (gateEnd + 1) * KT, max: 20 * KT } : null });

const solidTile = c => c === "#" || c === "X";

/* part 2 · the cake: drawn in pixels (chocolate, his toppings, his words), saved for nov 10 */
const CAKE_W = 480, CAKE_H = 420, CK = 4;                 // final size; the cake itself is drawn at 1/4 and scaled up
const CAKE_STYLES = [["drip", "Chocolate drip"], ["frosted", "Fully frosted"], ["naked", "Naked layers"]];
function cakeGeom(d) { const n = d.layers || 2, bottom = 88, top = bottom - n * 13; return { n, bottom, top, cx: 60, rx: 40, ry: 9, topPx: top * CK }; }
function renderCake(d, withItems = true) {
  const G = cakeGeom(d), lo = document.createElement("canvas"); lo.width = CAKE_W / CK; lo.height = CAKE_H / CK;
  const x = lo.getContext("2d");
  const tone = { perfect: ["#6b3720", "#7d4428", "#552a17"], pale: ["#8e5a38", "#a06a45", "#744628"], burnt: ["#3e1d10", "#4c2414", "#2d140a"] }[d.bake || "perfect"];
  const GAN = "#3b1a0d", GAN2 = "#5a2a18", CREAM = "#f2dcc0", CREAM2 = "#e6c9a6";
  const px = (X, Y, c) => { x.fillStyle = c; x.fillRect(X, Y, 1, 1); };
  const curve = X => Math.sqrt(Math.max(0, 1 - ((X + .5 - G.cx) / G.rx) ** 2)) * G.ry;   // front edge of an ellipse at column X
  // shadow and plate
  x.fillStyle = "rgba(0,0,0,.22)"; x.beginPath(); x.ellipse(60, 96, 56, 7, 0, 0, 7); x.fill();
  x.fillStyle = "#d9d2c6"; x.beginPath(); x.ellipse(60, 92, 56, 10, 0, 0, 7); x.fill();
  x.fillStyle = "#f4f1ec"; x.beginPath(); x.ellipse(60, 91, 54, 9, 0, 0, 7); x.fill();
  x.fillStyle = "#e9e3da"; x.beginPath(); x.ellipse(60, 91, 46, 6.5, 0, 0, 7); x.fill();
  // the side of the cake, column by column
  for (let X = G.cx - G.rx; X < G.cx + G.rx; X++) {
    const c = curve(X), u = (X - (G.cx - G.rx)) / (2 * G.rx);
    for (let Y = Math.floor(G.top + c); Y < G.bottom + c; Y++) {
      let col = u < .18 ? tone[1] : u > .82 ? tone[2] : tone[0];
      if (d.style === "frosted") col = u < .18 ? GAN2 : u > .82 ? "#2a1108" : GAN;
      else { for (let k = 1; k < G.n; k++) { const ly = G.bottom - k * 13 + c; if (Y >= ly - 1 && Y <= ly) col = Y === ly ? CREAM2 : CREAM; } }
      px(X, Y, col);
    }
  }
  // the top
  const topCol = d.style === "naked" ? CREAM : GAN, topCol2 = d.style === "naked" ? "#fbeedd" : GAN2;
  x.fillStyle = topCol; x.beginPath(); x.ellipse(G.cx, G.top, G.rx, G.ry, 0, 0, 7); x.fill();
  x.fillStyle = topCol2; x.beginPath(); x.ellipse(G.cx - 10, G.top - 2, 18, 4, 0, 0, 7); x.fill();
  // chocolate drips down the front
  if (d.style === "drip") {
    let s = d.seed || 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let X = G.cx - G.rx; X < G.cx + G.rx; X++) {
      const c = curve(X), base = G.top + c; const len = r() < .35 ? 4 + r() * (G.n * 5 + 4) : 1 + r() * 2;
      for (let Y = Math.floor(base); Y < base + len; Y++) px(X, Y, GAN);
    }
    for (let X = G.cx - G.rx; X < G.cx + G.rx; X += 1) { if (X % 7 === 2) px(X, Math.floor(G.top + curve(X)) + 1, GAN2); }
  }
  if (d.style === "naked") { for (let X = G.cx - G.rx + 2; X < G.cx + G.rx - 2; X += 6) px(X, Math.floor(G.top + curve(X)) - 1, "#ffffff"); }
  // outline everything that's cake or plate
  const img = x.getImageData(0, 0, lo.width, lo.height), dd = img.data, Wd = lo.width, Hd = lo.height, solid = (X, Y) => X >= 0 && Y >= 0 && X < Wd && Y < Hd && dd[(Y * Wd + X) * 4 + 3] > 200;
  const edge = [];
  for (let Y = 0; Y < Hd; Y++) for (let X = 0; X < Wd; X++) if (!solid(X, Y) && Y < 95 && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => solid(X + a, Y + b))) edge.push([X, Y]);
  edge.forEach(([X, Y]) => px(X, Y, "#2a1810"));
  // scale up, then toppings and words at full size
  const out = document.createElement("canvas"); out.width = CAKE_W; out.height = CAKE_H;
  const o = out.getContext("2d"); o.imageSmoothingEnabled = false; o.drawImage(lo, 0, 0, CAKE_W, CAKE_H);
  if (withItems) {
    (d.toppings || []).slice().sort((a, b) => a.y - b.y).forEach(t => { const im = itemSprite(t.k), s = t.k === "theo" ? 2.8 : 3.3, w = im.width * s, h = im.height * s; o.drawImage(im, t.x - w / 2, t.y - h * .8, w, h); });
    if (d.msg) {
      o.font = `700 ${d.msg.length > 16 ? 26 : 32}px Caveat, "Segoe Print", cursive`; o.textAlign = "center"; o.textBaseline = "middle"; o.lineJoin = "round";
      const words = d.msg.split(" "), lines = []; let cur = "";
      words.forEach(wd => { const t = cur ? cur + " " + wd : wd; if (o.measureText(t).width > 270 && cur) { lines.push(cur); cur = wd; } else cur = t; }); if (cur) lines.push(cur);
      const midY = ((G.top + G.bottom) / 2 + 7) * CK, lh = 30;
      lines.slice(0, 2).forEach((ln, i) => { const y = midY + (i - (Math.min(lines.length, 2) - 1) / 2) * lh; o.strokeStyle = "#2a1208"; o.lineWidth = 6; o.strokeText(ln, 240, y); o.fillStyle = "#fff7ef"; o.fillText(ln, 240, y); });
    }
  }
  return out;
}

function mixStage(host, onDone, say) {
  host.innerHTML = `<div class="mx"><p class="duo-lead">Stir the batter. Drag round and round the bowl until it's smooth.</p>
    <div class="mx-bowl"><canvas id="mx-c" width="320" height="240" aria-label="Mixing bowl. Drag in circles to stir."></canvas></div>
    <div class="mx-bar"><i id="mx-p"></i></div>
    <div class="row-btns" style="justify-content:center"><button class="btn" id="mx-next" type="button" hidden>Into the oven →</button></div></div>`;
  const cv = $("#mx-c"), x = cv.getContext("2d"), C = { x: 160, y: 120 };
  let acc = 0, lastA = null, spoon = { x: 200, y: 110 }, done = false;
  const lumps = Array.from({ length: 40 }, () => ({ a: Math.random() * 7, r: Math.random() * 80, s: 2 + Math.random() * 4 }));
  const mix = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; };
  function draw() {
    const t = Math.min(1, acc / (Math.PI * 2 * 5));
    x.clearRect(0, 0, 320, 240);
    x.fillStyle = "#cfd8e6"; x.beginPath(); x.ellipse(160, 130, 140, 92, 0, 0, Math.PI); x.fill();
    x.fillStyle = "#e9eef6"; x.beginPath(); x.ellipse(160, 110, 140, 48, 0, 0, 7); x.fill();
    x.fillStyle = mix("#b7845e", "#4a2412", t); x.beginPath(); x.ellipse(160, 114, 118, 36, 0, 0, 7); x.fill();
    lumps.forEach(l => { if (Math.random() > t * 1.15) { x.fillStyle = t < .5 ? "#e8d3b6" : "#8a5a3a"; const a = l.a + acc * .15; x.fillRect(160 + Math.cos(a) * l.r - l.s / 2, 114 + Math.sin(a) * l.r * .3 - l.s / 2, l.s, l.s); } });
    x.strokeStyle = `rgba(255,255,255,${.12 + t * .25})`; x.lineWidth = 3; x.beginPath(); x.ellipse(160, 114, 70, 20, 0, acc * .5, acc * .5 + 2.2); x.stroke();
    x.strokeStyle = "#c79c5b"; x.lineWidth = 9; x.lineCap = "round"; x.beginPath(); x.moveTo(spoon.x, spoon.y); x.lineTo(spoon.x + 40, spoon.y - 70); x.stroke();
    x.fillStyle = "#c79c5b"; x.beginPath(); x.ellipse(spoon.x, spoon.y, 12, 8, -.9, 0, 7); x.fill();
    $("#mx-p").style.width = Math.round(t * 100) + "%";
    if (t >= 1 && !done) { done = true; $("#mx-next").hidden = false; say("joy", "Silky smooth! 🍫", true); }
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * 320 / r.width, y: (e.clientY - r.top) * 240 / r.height }; };
  let down = false, lastSay = 0;
  cv.addEventListener("pointerdown", e => { down = true; cv.setPointerCapture(e.pointerId); const p = pos(e); spoon = p; lastA = Math.atan2((p.y - C.y) * 3, p.x - C.x); });
  cv.addEventListener("pointermove", e => { if (!down) return; const p = pos(e); spoon = p; const a = Math.atan2((p.y - C.y) * 3, p.x - C.x);
    if (lastA != null) { let d = a - lastA; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; acc += Math.abs(d); }
    lastA = a; if (performance.now() - lastSay > 700) { lastSay = performance.now(); say("bop", ["Stir stir…", "Round and round", "Ooh it's smoothing", "Mmm chocolate"][Math.random() * 4 | 0]); } draw(); });
  ["pointerup", "pointercancel"].forEach(ev => cv.addEventListener(ev, () => { down = false; lastA = null; }));
  $("#mx-next").onclick = onDone;
  draw();
}

  const G = () => cakeGeom(d);
  const onTop = (px, py) => { const g = G(), cx = g.cx * CK, cy = g.top * CK, rx = g.rx * CK - 18, ry = g.ry * CK - 4; const u = (px - cx) / rx, v = (py - cy) / ry, r = Math.hypot(u, v); return r <= 1 ? [px, py] : [cx + u / r * rx, cy + v / r * ry]; };
  if (!d.candles) { const g = G(); d.candles = { two: [g.cx * CK - 70, g.top * CK + 6], seven: [g.cx * CK + 70, g.top * CK + 6] }; }
  function paint() {
    cv.getContext("2d").clearRect(0, 0, CAKE_W, CAKE_H); cv.getContext("2d").drawImage(renderCake({ ...d, toppings: d.toppings }), 0, 0);
    stage.querySelectorAll(".dc-candle").forEach(e => e.remove());
    [["two", "2"], ["seven", "7"]].forEach(([k, n]) => { const el = document.createElement("div"); el.className = "dc-candle"; el.dataset.c = k; el.innerHTML = `<i></i><b>${n}</b>`;
      const [cx, cy] = d.candles[k]; el.style.left = (cx / CAKE_W * 100) + "%"; el.style.top = (cy / CAKE_H * 100) + "%"; stage.appendChild(el); drag(el, (px, py) => { d.candles[k] = onTop(px, py); }, false); });
    host.querySelectorAll(".choices").forEach(gp => gp.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(d[gp.dataset.k]) === b.dataset.v)));
  }
  // drag helper: moves an overlay element, or (for toppings on the canvas) picks the nearest one
  function drag(el, move, removable) {
    el.addEventListener("pointerdown", e => { e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add("lift");
      const mv = ev => { const r = stage.getBoundingClientRect(), px = (ev.clientX - r.left) / scale(), py = (ev.clientY - r.top) / scale(); const p = onTop(px, py); el.style.left = (p[0] / CAKE_W * 100) + "%"; el.style.top = (p[1] / CAKE_H * 100) + "%"; move(p[0], p[1]); };
      const up = () => { el.releasePointerCapture?.(e.pointerId); el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.classList.remove("lift"); paint(); };
      el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up); });
  }
  // placed toppings are picked up straight from the cake
  cv.addEventListener("pointerdown", e => {
    const r = stage.getBoundingClientRect(), px = (e.clientX - r.left) / scale(), py = (e.clientY - r.top) / scale();
    let best = -1, bd = 44; d.toppings.forEach((t, i) => { const dist = Math.hypot(t.x - px, t.y - 20 - py); if (dist < bd) { bd = dist; best = i; } });
    if (best < 0) return; e.preventDefault(); const t = d.toppings.splice(best, 1)[0]; paint();
    const ghost = document.createElement("img"); ghost.className = "dc-ghost"; ghost.src = toppingSprite(t.k); stage.appendChild(ghost);
    const place = ev => { const rr = stage.getBoundingClientRect(); ghost.style.left = (ev.clientX - rr.left) + "px"; ghost.style.top = (ev.clientY - rr.top) + "px"; };
    place(e); cv.setPointerCapture(e.pointerId);
    const mv = ev => place(ev), up = ev => { cv.removeEventListener("pointermove", mv); cv.removeEventListener("pointerup", up); ghost.remove();
      const rr = stage.getBoundingClientRect(), qx = (ev.clientX - rr.left) / scale(), qy = (ev.clientY - rr.top) / scale(), g = G();
      const off = Math.hypot((qx - g.cx * CK) / (g.rx * CK), (qy - g.top * CK) / (g.ry * CK * 2.2)) > 1.25;
      if (!off) { const p = onTop(qx, qy); d.toppings.push({ k: t.k, x: p[0], y: p[1] }); } else say("bop", "Okay, not that one");
      paint(); };
    cv.addEventListener("pointermove", mv); cv.addEventListener("pointerup", up);
  });
  host.querySelector(".dc-tray").onclick = e => { const b = e.target.closest(".tp"); if (!b) return;
    if (d.toppings.length >= 16) return say("bop", "That's a LOT of toppings 😂");
    const g = G(), a = Math.random() * Math.PI * 2, rr = Math.random() * .8; d.toppings.push({ k: b.dataset.t, x: g.cx * CK + Math.cos(a) * rr * (g.rx * CK - 30), y: g.top * CK + Math.sin(a) * rr * (g.ry * CK - 8) }); paint();
    say("bop", b.dataset.t === "theo" ? "Tiny Theo on top! 😻" : "Yum!"); };
  host.querySelectorAll(".choices").forEach(gp => gp.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = gp.dataset.k, old = G().top;
    d[k] = k === "layers" ? +b.dataset.v : b.dataset.v; const dy = (G().top - old) * CK; d.toppings.forEach(t => t.y += dy); ["two", "seven"].forEach(c => d.candles[c][1] += dy); paint(); say("bop", "Ooh fancy"); });
  $("#dc-msg").oninput = e => { d.msg = e.target.value; paint(); };
  $("#dc-clear").onclick = () => { d.toppings = []; paint(); };
  $("#dc-reset").onclick = () => { st.design = null; decorateStage(host, st, duo, onSave, say); say("bop", "Fresh cake!"); };
  $("#dc-save").onclick = () => onSave(d);
  new ResizeObserver(() => { if (document.contains(stage)) paint(); }).observe(stage);
  paint(); document.fonts?.load('700 32px "Caveat"').then(() => { if (document.contains(stage)) paint(); }).catch(() => {});
}

/* part 3 · the day itself */
function renderDay8(view, pv) {
  const game = stage(view, pv, "Day 8 · Bake it together", "", ` · <a href="#" id="bk-reset">start over</a>`);
  view.querySelector(".stage").classList.add("loose");                 // on phones the buddy bar scrolls away here, so the cake and kitchen stay in view
  if (pv) $("#bk-reset").onclick = e => { e.preventDefault(); store.del(BAKE_KEY()); store.del(CAKE_KEY); route(); };
  const duo = loadDuo(), st = store.get(BAKE_KEY()) || { stage: "intro" }, save = () => store.set(BAKE_KEY(), st);
  const him = loadBuddy(), her = loadPartner();
  const say = (mood, text, big) => mood === "bop" ? buddy.bop(text) : buddy.say(mood, text, { hold: false, ms: 1600, after: "Let's bake! 🍫", burst: big ? "big" : false });
  if (!(duo.ready && her)) {
    game.innerHTML = `<div class="duo-card"><p class="duo-teaser"><b>The bakers aren't ready yet.</b> Design them, pick their powers and choose your toppings on Day 6 first.</p>
      <div class="row-btns" style="justify-content:center"><button class="btn" id="go6" type="button">Go to Day 6 →</button></div></div>`;
    $("#go6").onclick = () => { viewing = 6; route(); }; return;
  }
  const go = s => { st.stage = s; save(); stopKitchen(); show(); game.scrollIntoView({ block: "start", behavior: "smooth" }); };
  function show() {
    if (st.stage === "intro") return intro();
    if (st.stage === "kitchen") return playKitchen(game, duo, () => { say("joy", "Everything's collected!! 🎉", true); go("mix"); }, onEvent);
    if (st.stage === "mix") return mixStage(game, () => go("bake"), say);
    if (st.stage === "bake") return bakeStage(game, res => { st.bake = res; go("decorate"); }, say);
    if (st.stage === "decorate") return decorateStage(game, st, duo, async d => {
      try { await document.fonts.load('700 32px "Caveat"'); } catch (e) {}
      const img = renderCake(d).toDataURL("image/png");
      store.set(CAKE_KEY, { img, w: CAKE_W, h: CAKE_H, candles: d.candles, msg: d.msg, made: Date.now() });
      st.design = d; go("done"); say("joy", "It's PERFECT!! 🎂", true);
    }, say);
    if (st.stage === "done") return done();
  }
  function intro() {
    const pw = k => POWERS.find(p => p.key === duo.powers[k]);
    game.innerHTML = `<div class="duo-card">
      <div class="duo-pair">${[["m", him], ["f", her]].map(([k, c]) => `<figure><img src="${avatarURL(c, "idle", 4)}" alt=""><figcaption><b>${escapeHtml(c.name)}</b><span>${pw(k).icon} ${pw(k).name}</span></figcaption></figure>`).join("")}</div>
      <p class="duo-teaser">Together, collect everything for a chocolate cake, then bake it and decorate it. <b>On Nov 10, this is the cake you'll blow the candles out on.</b></p>
      <ul class="bk-rules">
        <li>Each of you has your own lane in the kitchen. Get your ingredient, then stand at your oven door.</li>
        <li>${pw("m").icon} <b>${escapeHtml(him.name)}</b>: ${pw("m").what}</li>
        <li>${pw("f").icon} <b>${escapeHtml(her.name)}</b>: ${pw("f").what}</li>
        <li>Theo wanders about. He won't hurt you, he just gets in the way. 🐾</li>
      </ul>
      <div class="row-btns" style="justify-content:center"><button class="btn" id="bk-start" type="button">Into the kitchen →</button></div></div>`;
    $("#bk-start").onclick = () => { try { catAudio(); } catch (e) {} go("kitchen"); };
    buddy.say("idle", "Aprons on! 👩‍🍳");
  }
  function onEvent(kind, who, extra) {
    const n = who ? escapeHtml(who.name || "") : "";
    if (kind === "item") say("joy", `${n} got the ${extra.toLowerCase()}!`);
    if (kind === "oops") say("sad", extra === "milk" ? `${n} can't swim in milk!` : `Ouch! ${n} isn't fireproof!`);
    if (kind === "melt") say("bop", "🔥 Chocolate wall melted!");
    if (kind === "douse") say("bop", "💧 Fire's out!");
    if (kind === "bubble") say("bop", "🫧 Boing!");
    if (kind === "theo") { say("bop", "Theo! Move! 🐾"); try { meow({ pitch: 1.1, dur: .35 }); } catch (e) {} }
    if (kind === "switch") say("bop", `Moving ${n}`);
    if (kind === "clear") say("joy", "Kitchen cleared! ✨");
    if (kind === "restart") say("bop", "Fresh start!");
  }
  function done() {
    const cake = store.get(CAKE_KEY);
    game.innerHTML = `<div class="duo-card">
      <img class="bk-final" src="${cake?.img || renderCake(st.design).toDataURL()}" alt="The cake you made">
      <p class="duo-teaser"><b>Your cake is ready.</b> It'll be waiting for you on Nov 10, with the 2 and 7 candles right where you put them.</p>
      <div class="duo-redo"><span>Want to change something?</span>
        <button class="btn ghost" type="button" data-go="decorate">Redecorate</button><button class="btn ghost" type="button" data-go="bake">Bake again</button><button class="btn ghost" type="button" data-go="kitchen">Play the kitchen again</button></div>
      <p class="msg"><strong>Tomorrow's candle lights at midnight.</strong></p></div>`;
    game.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  }
  show();
}


/* ---------- confetti ---------- */
function confetti(ox = innerWidth / 2, oy = innerHeight / 3, n = 140) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#e2457a", "#5fbf95", "#f2c14e", "#b39cf5", "#ff9a5c"];
  const ps = Array.from({ length: n }, () => ({ x: ox, y: oy, vx: (Math.random() - .5) * 14, vy: Math.random() * -14 - 4, r: Math.random() * 6 + 4, c: cols[Math.random() * 5 | 0], a: Math.random() * 6 }));
  let f = 0;
  (function step() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (++f < 180) requestAnimationFrame(step); else x.clearRect(0, 0, c.width, c.height);
  })();
}
