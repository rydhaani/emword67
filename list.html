<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>the list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
:root { --space: #03040b; --ink: #f5f6fb; --ink-soft: rgba(245,246,251,.62); --line: rgba(255,255,255,.11); --accent: #5dffa4;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", "Segoe UI", Roboto, sans-serif; color-scheme: dark; }
html, body { min-height: 100%; margin: 0; }
body { background: radial-gradient(ellipse at 30% 20%, rgba(120,60,200,.14), transparent 60%), radial-gradient(ellipse at 75% 75%, rgba(255,80,160,.1), transparent 60%), var(--space);
  color: var(--ink); font-family: var(--font); text-transform: lowercase; -webkit-font-smoothing: antialiased; }
main { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: grid; place-items: center; text-align: center;
  padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.box { display: flex; flex-direction: column; gap: 12px; align-items: center; }
h1 { margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -.04em; }
p { margin: 0; color: var(--ink-soft); font-size: 17px; }
a { margin-top: 12px; color: var(--ink); text-decoration: none; font-size: 15px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.045); }
a:hover { border-color: var(--accent); }
</style>
<main><div class="box"><h1>the list</h1><p>coming soon <span style="color:var(--accent)">♥</span></p><a href="index.html">← back</a></div></main>

</html>
